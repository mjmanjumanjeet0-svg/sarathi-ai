plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sarathi.ai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sarathi.ai'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
