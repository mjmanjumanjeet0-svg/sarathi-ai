name: Deploy Sarathi AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and normalize Cloudflare credentials
        env:
          CF_API_TOKEN_INPUT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_INPUT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="$(printf '%s' "$CF_API_TOKEN_INPUT" | tr -d '[:space:]')"
          account="$(printf '%s' "$CF_ACCOUNT_ID_INPUT" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing or empty."
            exit 1
          fi
          if [ -z "$account" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing or empty."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
