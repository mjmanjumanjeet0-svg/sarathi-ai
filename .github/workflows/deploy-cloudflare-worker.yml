name: Deploy Sarathi AI Worker to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "app.js"
      - "index.html"
      - "style.css"
      - ".github/workflows/deploy-cloudflare-worker.yml"

permissions:
  contents: read

concurrency:
  group: sarathi-ai-worker-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate website and Worker syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check app.js
          test -s index.html
          test -s style.css
          test -s wrangler.toml
          grep -q '^main = "worker.js"$' wrangler.toml

  deploy:
    name: Deploy Worker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
