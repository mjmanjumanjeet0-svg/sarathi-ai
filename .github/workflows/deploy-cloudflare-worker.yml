name: Deploy Sarathi AI Worker to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker.yml"

permissions:
  contents: read

concurrency:
  group: sarathi-ai-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Worker source and Wrangler config
        run: |
          test -s worker.js
          test -s wrangler.toml
          if grep -nF '\\n      const search' worker.js; then
            echo "Literal escaped newline found in worker.js."
            exit 1
          fi
          grep -q '^main = "worker.js"$' wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
