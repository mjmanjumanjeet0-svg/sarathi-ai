name: Deploy Sarathi AI Worker to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker.yml"

permissions:
  contents: read

concurrency:
  group: sarathi-ai-worker-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker and website syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check app.js
          test -s index.html
          test -s style.css
          test -s wrangler.toml
          grep -q '^main = "worker.js"$' wrangler.toml

  deploy:
    name: Deploy Worker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Cloudflare API token format
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty."
            exit 1
          fi
          if [[ "$TOKEN" == *'curl '* || "$TOKEN" == *'-H '* || "$TOKEN" == *'Bearer '* || "$TOKEN" == *$'\\n'* || "$TOKEN" == *$'\\r'* ]]; then
            echo "Secret must contain only the raw Cloudflare API token. Do not include curl, -H, Authorization, or Bearer."
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployed Worker health
        run: |
          node --input-type=module <<'NODE'
          const url = "https://sarathi-ai.mjmanjumanjeet0.workers.dev/";
          const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
          const body = await response.json();
          const requiredEndpoints = ["/api/login", "/api/chat"];
          const endpoints = body.endpoints || {};
          const missing = requiredEndpoints.filter(path => !Object.values(endpoints).includes(path));
          if (!response.ok || body.status !== "running" ||
              body.service !== "Sarathi AI Worker" || body.zeroCostMode !== true || missing.length) {
            throw new Error("Post-deploy Worker health verification failed (HTTP " + response.status +
              ", status=" + body.status + ", zeroCostMode=" + body.zeroCostMode +
              ", missingEndpoints=" + missing.join(",") + ")");
          }
          console.log("POST-DEPLOY WORKER HEALTH: PASS");
          console.log("Service:", body.service);
          console.log("Status:", body.status);
          console.log("Zero-cost mode:", body.zeroCostMode);
          console.log("Required endpoints:", requiredEndpoints.join(", "));
          NODE
