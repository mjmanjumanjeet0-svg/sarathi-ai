name: Deploy Sarathi AI Worker to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker.yml"

permissions:
  contents: read

concurrency:
  group: sarathi-ai-worker-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker and website syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check app.js
          test -s index.html
          test -s style.css
          test -s wrangler.toml
          grep -q '^main = "worker.js"$' wrangler.toml

  deploy:
    name: Deploy Worker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize Cloudflare API token
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\\r\\n')"
          if [ -z "$token" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is empty."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN_CLEAN=$token" >> "$GITHUB_ENV"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN_CLEAN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
