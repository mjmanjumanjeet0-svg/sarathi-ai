name: Validate Sarathi AI

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "worker.js"
      - "index.html"
      - "style.css"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript and web asset checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check worker.js

      - name: Check required web files
        run: |
          test -s index.html
          test -s style.css
          test -s logo.svg
          grep -q 'id="educationHub"' index.html
          grep -q 'function parseSarathiQuiz' app.js
          grep -q 'function renderQuizCard' app.js
