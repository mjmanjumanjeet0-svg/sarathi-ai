name: Validate Sarathi AI

on:
  push:
    branches: [main, sarathi-audit-fixes-2026-10]
    paths:
      - "app.js"
      - "voice.js"
      - "worker.js"
      - "index.html"
      - "style.css"
      - "android-app/app/src/main/AndroidManifest.xml"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript and Android manifest checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check voice.js
          node --input-type=module --check < worker.js

      - name: Check required web files
        run: |
          test -s index.html
          test -s style.css
          test -s logo.svg
          grep -q 'id="webToggle"' index.html
          grep -q 'id="chatForm"' index.html
          grep -q 'function parseSarathiQuiz' app.js
          grep -q 'function renderQuizCard' app.js

      - name: Validate Android manifest XML
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('android-app/app/src/main/AndroidManifest.xml'); print('Android manifest XML is valid')"
