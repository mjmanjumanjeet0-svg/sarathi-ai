<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>सारथी AI – आपका हिन्दी AI सहायक</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #020617;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
      border-bottom: 1px solid #1e293b;
    }
    .header-left, .header-right {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e3a8a, #0f172a);
      border: 1px solid #3b82f6;
      color: #93c5fd;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(59,130,246,0.4);
    }
    .icon-btn small {
      display: block;
      font-size: 9px;
      margin-top: 2px;
      color: #93c5fd;
    }

    /* Logo Area */
    .logo-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .peacock {
      width: 180px;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(59,130,246,0.6));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .title {
      font-size: 42px;
      font-weight: 800;
      background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 8px;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 15px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Chat Area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #1e293b;
      border: 1px solid #334155;
      border-bottom-left-radius: 4px;
    }
    .typing {
      align-self: flex-start;
      background: #1e293b;
      padding: 12px 18px;
      border-radius: 18px;
      color: #94a3b8;
    }

    /* Input Bar */
    .input-bar {
      padding: 12px 16px 20px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      border-radius: 30px;
      padding: 6px 8px;
      border: 1px solid #334155;
      box-shadow: 0 0 20px rgba(59,130,246,0.15);
    }
    .plus-btn, .mic-btn, .send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }
    .plus-btn {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      color: white;
    }
    .mic-btn {
      background: transparent;
      color: #94a3b8;
    }
    .send-btn {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      color: white;
    }
    #input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 15px;
      padding: 10px 4px;
      outline: none;
    }
    #input::placeholder { color: #64748b; }

    /* Empty state hide when chat starts */
    .logo-area.hidden { display: none; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <button class="icon-btn" onclick="alert('सेटिंग्स जल्द आ रही हैं')">⚙️</button>
      <button class="icon-btn" onclick="clearChat()">🕐</button>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="alert('मेनू')">☰</button>
      <button class="icon-btn" onclick="newChat()">💬</button>
    </div>
  </div>

  <!-- Logo / Welcome -->
  <div class="logo-area" id="logoArea">
    <!-- Peacock feather SVG (simplified) -->
    <svg class="peacock" viewBox="0 0 200 200" fill="none">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="50%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
      </defs>
      <path d="M100 20 C140 40 160 80 150 120 C140 160 100 180 60 150 C30 120 40 60 100 20" fill="url(#g1)" opacity="0.9"/>
      <circle cx="110" cy="90" r="18" fill="#1e3a8a"/>
      <circle cx="110" cy="90" r="10" fill="#60a5fa"/>
      <circle cx="110" cy="90" r="5" fill="#fbbf24"/>
    </svg>
    <div class="title">सारथी AI</div>
    <div class="subtitle">आपका हिन्दी AI सहायक</div>
  </div>

  <!-- Chat messages -->
  <div id="chat"></div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-wrapper">
      <button class="plus-btn" onclick="alert('अटैचमेंट जल्द')">+</button>
      <input id="input" type="text" placeholder="सारथी से कुछ पूछें..." autocomplete="off" />
      <button class="mic-btn" onclick="startVoice()">🎤</button>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    let messages = [];
    const chatEl = document.getElementById('chat');
    const logoArea = document.getElementById('logoArea');
    const input = document.getElementById('input');

    input.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      logoArea.classList.add('hidden');
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing';
      div.textContent = 'सारथी सोच रहा है...';
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();
        removeTyping();

        if (data.reply) {
          addMessage('bot', data.reply);
          messages.push({ role: 'assistant', content: data.reply });
        } else {
          addMessage('bot', data.error || 'कुछ गड़बड़ हो गई');
        }
      } catch (err) {
        removeTyping();
        addMessage('bot', 'नेटवर्क समस्या। दोबारा कोशिश करें।');
      }
    }

    function newChat() {
      messages = [];
      chatEl.innerHTML = '';
      logoArea.classList.remove('hidden');
    }

    function clearChat() {
      if (confirm('पूरा चैट इतिहास मिटा दें?')) newChat();
    }

    // Voice (Web Speech API)
    function startVoice() {
      if (!('webkitSpeechRecognition' in window)) {
        alert('आपके ब्राउज़र में वॉइस सपोर्ट नहीं है');
        return;
      }
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.interimResults = false;
      recognition.onresult = e => {
        input.value = e.results[0][0].transcript;
        sendMessage();
      };
      recognition.start();
    }
  </script>
</body>
</html>
