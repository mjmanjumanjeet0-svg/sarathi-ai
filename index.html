<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>सारथी AI – आपका हिन्दी AI सहायक</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000000;
      color: #ffffff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #000000;
      border-bottom: 1px solid #333333;
    }
    .header-left, .header-right {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #111111;
      border: 1px solid #ffffff;
      color: #ffffff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Logo Area */
    .logo-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .peacock {
      width: 160px;
      height: auto;
      filter: grayscale(100%) brightness(1.2);
    }
    .title {
      font-size: 42px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 12px;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 15px;
      color: #cccccc;
      margin-top: 6px;
    }

    /* Chat Area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #ffffff;
      color: #000000;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #1a1a1a;
      border: 1px solid #444444;
      color: #ffffff;
      border-bottom-left-radius: 4px;
    }
    .typing {
      align-self: flex-start;
      background: #1a1a1a;
      padding: 12px 18px;
      border-radius: 18px;
      color: #aaaaaa;
      border: 1px solid #444444;
    }

    /* Input Bar */
    .input-bar {
      padding: 12px 16px 20px;
      background: #000000;
      border-top: 1px solid #333333;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111111;
      border-radius: 30px;
      padding: 6px 8px;
      border: 1px solid #ffffff;
    }
    .plus-btn, .mic-btn, .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }
    .plus-btn {
      background: #ffffff;
      color: #000000;
    }
    .mic-btn {
      background: transparent;
      color: #ffffff;
    }
    .send-btn {
      background: #ffffff;
      color: #000000;
    }
    #input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 15px;
      padding: 10px 4px;
      outline: none;
    }
    #input::placeholder {
      color: #888888;
    }

    .logo-area.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <button class="icon-btn" onclick="alert('सेटिंग्स जल्द आ रही हैं')">⚙️</button>
      <button class="icon-btn" onclick="clearChat()">🕐</button>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="alert('मेनू')">☰</button>
      <button class="icon-btn" onclick="newChat()">💬</button>
    </div>
  </div>

  <!-- Logo / Welcome -->
  <div class="logo-area" id="logoArea">
    <svg class="peacock" viewBox="0 0 200 200" fill="none">
      <path d="M100 20 C140 40 160 80 150 120 C140 160 100 180 60 150 C30 120 40 60 100 20" fill="#ffffff" opacity="0.9"/>
      <circle cx="110" cy="90" r="18" fill="#000000"/>
      <circle cx="110" cy="90" r="10" fill="#ffffff"/>
      <circle cx="110" cy="90" r="5" fill="#000000"/>
    </svg>
    <div class="title">सारथी AI</div>
    <div class="subtitle">आपका हिन्दी AI सहायक</div>
  </div>

  <!-- Chat messages -->
  <div id="chat"></div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-wrapper">
      <button class="plus-btn" onclick="alert('अटैचमेंट जल्द')">+</button>
      <input id="input" type="text" placeholder="सारथी से कुछ पूछें..." autocomplete="off" />
      <button class="mic-btn" onclick="startVoice()">🎤</button>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    let messages = [];
    const chatEl = document.getElementById('chat');
    const logoArea = document.getElementById('logoArea');
    const input = document.getElementById('input');

    input.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      logoArea.classList.add('hidden');
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing';
      div.textContent = 'सारथी सोच रहा है...';
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();
        removeTyping();

        if (data.reply) {
          addMessage('bot', data.reply);
          messages.push({ role: 'assistant', content: data.reply });
        } else {
          addMessage('bot', data.error || 'कुछ गड़बड़ हो गई');
        }
      } catch (err) {
        removeTyping();
        addMessage('bot', 'नेटवर्क समस्या। दोबारा कोशिश करें।');
      }
    }

    function newChat() {
      messages = [];
      chatEl.innerHTML = '';
      logoArea.classList.remove('hidden');
    }

    function clearChat() {
      if (confirm('पूरा चैट इतिहास मिटा दें?')) newChat();
    }

    function startVoice() {
      if (!('webkitSpeechRecognition' in window)) {
        alert('आपके ब्राउज़र में वॉइस सपोर्ट नहीं है');
        return;
      }
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.interimResults = false;
      recognition.onresult = e => {
        input.value = e.results[0][0].transcript;
        sendMessage();
      };
      recognition.start();
    }
  </script>
</body>
</html>
