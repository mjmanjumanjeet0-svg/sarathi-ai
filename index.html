<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>सारथी AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f8fa;
      color: #202124;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      min-height: 64px;
      padding: 10px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }

    .sarathi-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eef2ff;
      font-size: 24px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;

      padding: 8px 13px;
      border-radius: 10px;

      font-size: 14px;
      font-weight: 600;
    }

    .header-btn:active {
      transform: scale(0.98);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      width: 100%;
      max-width: 1100px;
      margin: auto;

      flex: 1;

      display: flex;
      flex-direction: column;

      padding: 20px 14px 150px;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      text-align: center;
      padding: 45px 15px 30px;
    }

    .welcome-icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background: #eef2ff;

      font-size: 40px;
    }

    .welcome h1 {
      margin: 0 0 10px;

      font-size: 28px;
      line-height: 1.25;

      color: #111827;
    }

    .welcome p {
      max-width: 650px;
      margin: 0 auto;

      font-size: 15px;
      line-height: 1.6;

      color: #6b7280;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      padding: 15px;
    }

    .message-row {
      width: 100%;
      display: flex;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(85%, 760px);

      padding: 12px 14px;

      border-radius: 16px;

      line-height: 1.6;
      font-size: 15px;

      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      background: #2563eb;
      color: #ffffff;

      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      background: #ffffff;
      color: #202124;

      border: 1px solid #e5e7eb;

      border-bottom-left-radius: 5px;
    }

    .message-tools {
      display: flex;
      gap: 6px;

      margin-top: 8px;
      padding-top: 7px;

      border-top: 1px solid #eeeeee;
    }

    .message-tool {
      border: 0;
      background: transparent;

      color: #6b7280;

      font-size: 12px;
      padding: 4px 6px;

      border-radius: 7px;
    }

    .message-tool:hover {
      background: #f3f4f6;
      color: #111827;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      min-height: 20px;

      padding: 4px 4px 0;

      color: #6b7280;
      font-size: 12px;
      text-align: center;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 90;

      background: rgba(255, 255, 255, 0.96);

      border-top: 1px solid #e5e7eb;

      backdrop-filter: blur(12px);
    }

    .composer-inner {
      width: 100%;
      max-width: 1100px;

      margin: auto;

      padding: 10px 12px 12px;
    }

    .input-wrap {
      width: 100%;

      display: flex;
      flex-direction: column;

      border: 1px solid #d1d5db;

      background: #ffffff;

      border-radius: 16px;

      overflow: hidden;
    }

    #input {
      width: 100%;

      min-height: 48px;
      max-height: 150px;

      resize: none;

      border: 0;
      outline: none;

      padding: 13px 14px 8px;

      color: #111827;
      background: #ffffff;

      line-height: 1.5;
    }

    #input::placeholder {
      color: #9ca3af;
    }

    /* =========================
       TOOLS
    ========================= */

    .tools-row {
      display: flex;
      align-items: center;
      gap: 6px;

      padding: 5px 7px 7px;

      overflow-x: auto;
    }

    .tool-btn {
      flex: 0 0 auto;

      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 10px;

      background: #f3f4f6;
      color: #374151;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
    }

    .tool-btn:active {
      transform: scale(0.95);
    }

    .tool-btn.active {
      background: #dbeafe;
      color: #2563eb;
    }

    .send-btn {
      flex: 0 0 auto;

      width: 42px;
      height: 38px;

      margin-left: auto;

      border: 0;
      border-radius: 10px;

      background: #2563eb;
      color: #ffffff;

      font-size: 19px;
      font-weight: 700;
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .search-indicator {
      flex: 0 0 auto;

      font-size: 11px;
      color: #6b7280;

      white-space: nowrap;
    }

    /* =========================
       ATTACHMENT
    ========================= */

    .attachment-preview {
      display: none;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 8px 12px;

      margin-bottom: 7px;

      background: #eff6ff;

      border: 1px solid #bfdbfe;

      border-radius: 10px;

      color: #1e40af;

      font-size: 13px;
    }

    .attachment-preview.show {
      display: flex;
    }

    .remove-file {
      width: 28px;
      height: 28px;

      border: 0;
      border-radius: 8px;

      background: #ffffff;

      color: #dc2626;

      font-size: 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       HIDDEN
    ========================= */

    .hidden {
      display: none !important;
    }

    /* =========================
       LOADING
    ========================= */

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .typing span {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #9ca3af;

      animation: typing 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .header-inner {
        min-height: 58px;
        padding: 8px 12px;
      }

      .brand {
        font-size: 18px;
      }

      .sarathi-icon {
        width: 38px;
        height: 38px;
        font-size: 22px;
      }

      .header-btn {
        padding: 7px 10px;
        font-size: 13px;
      }

      .main {
        padding: 12px 10px 150px;
      }

      .welcome {
        padding: 35px 10px 24px;
      }

      .welcome-icon {
        width: 62px;
        height: 62px;
        font-size: 34px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .welcome p {
        font-size: 14px;
      }

      .message {
        max-width: 92%;
        font-size: 14px;
      }

      .tools-row {
        gap: 5px;
      }

      .tool-btn {
        width: 36px;
        height: 36px;
      }

      .send-btn {
        width: 40px;
        height: 36px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">
    <div class="header-inner">

      <div class="brand">
        <div class="sarathi-icon">🧭</div>
        <span>सारथी AI</span>
      </div>

      <div class="header-actions">
        <button
          class="header-btn"
          type="button"
          onclick="openStudy()"
        >
          📚 Study
        </button>
      </div>

    </div>
  </header>

  <!-- =========================
       MAIN
  ========================= -->

  <main class="main">

    <section id="welcome" class="welcome">

      <div class="welcome-icon">
        🧭
      </div>

      <h1>
        नमस्ते! मैं सारथी हूँ 👋
      </h1>

      <p>
        मुझसे लिखकर या बोलकर बात करो।
        फोटो भेजो, सवाल पूछो या Internet Search करो।
      </p>

    </section>

    <section id="chatBox" class="chat-box">

      <div id="emptyMessage" class="empty">
        नीचे अपना सवाल लिखो या 🎤 माइक दबाकर बोलो।
      </div>

    </section>

  </main>

  <!-- =========================
       FILE INPUTS
  ========================= -->

  <input
    id="photoInput"
    class="hidden"
    type="file"
    accept="image/*"
  >

  <input
    id="videoInput"
    class="hidden"
    type="file"
    accept="video/*"
  >

  <input
    id="fileInput"
    class="hidden"
    type="file"
    accept=".txt,.csv,.json,.md"
  >

  <!-- =========================
       COMPOSER
  ========================= -->

  <div class="composer">

    <div class="composer-inner">

      <div
        id="attachmentPreview"
        class="attachment-preview"
      >
        <span id="attachmentText">
          फ़ाइल चुनी गई
        </span>

        <button
          class="remove-file"
          type="button"
          onclick="removeAttachment()"
        >
          ×
        </button>
      </div>

      <div class="input-wrap">

        <textarea
          id="input"
          rows="1"
          placeholder="सारथी से कुछ पूछें..."
        ></textarea>

        <div class="tools-row">

          <button
            id="micButton"
            class="tool-btn"
            type="button"
            title="माइक"
            onclick="toggleMicrophone()"
          >
            🎤
          </button>

          <button
            class="tool-btn"
            type="button"
            title="फोटो"
            onclick="document.getElementById('photoInput').click()"
          >
            📷
          </button>

          <button
            class="tool-btn"
            type="button"
            title="वीडियो"
            onclick="document.getElementById('videoInput').click()"
          >
            🎥
          </button>

          <button
            class="tool-btn"
            type="button"
            title="फाइल"
            onclick="document.getElementById('fileInput').click()"
          >
            📎
          </button>

          <button
            id="searchButton"
            class="tool-btn"
            type="button"
            title="Internet Search"
            onclick="toggleSearch()"
          >
            🌐
          </button>

          <span
            id="searchIndicator"
            class="search-indicator"
          >
            Search OFF
          </span>

          <button
            id="voiceButton"
            class="tool-btn"
            type="button"
            title="आवाज़"
            onclick="toggleVoice()"
          >
            🔊
          </button>

          <button
            id="sendButton"
            class="send-btn"
            type="button"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>

      <div
        id="status"
        class="status"
      ></div>

    </div>

  </div>

  <!-- भाग 2 में यहीं से JavaScript शुरू होगा -->
  <script>

    /* =========================
       SARATHI AI JAVASCRIPT
    ========================= */

    const API_BASE =
      "https://sarathi-ai.mjmanjumanjeet0.workers.dev";

    let messages = [];
    let useSearch = false;

    // अपने-आप आवाज नहीं बोलेगी
    let voiceEnabled = false;

    let isListening = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let microphoneStream = null;

    let selectedFile = null;

    const input =
      document.getElementById("input");

    const chatBox =
      document.getElementById("chatBox");

    const status =
      document.getElementById("status");

    const micButton =
      document.getElementById("micButton");

    const searchButton =
      document.getElementById("searchButton");

    const searchIndicator =
      document.getElementById("searchIndicator");

    const voiceButton =
      document.getElementById("voiceButton");

    const attachmentPreview =
      document.getElementById("attachmentPreview");

    const attachmentText =
      document.getElementById("attachmentText");


    /* =========================
       BASIC HELPERS
    ========================= */

    function setStatus(text) {
      if (status) {
        status.textContent = text || "";
      }
    }


    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function removeEmptyMessage() {
      const empty =
        document.getElementById("emptyMessage");

      if (empty) {
        empty.remove();
      }
    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(role, text) {

      removeEmptyMessage();

      const row =
        document.createElement("div");

      row.className =
        "message-row " + role;

      const message =
        document.createElement("div");

      message.className =
        "message " + role;

      const content =
        document.createElement("div");

      content.className =
        "message-content";

      content.textContent =
        String(text || "");

      message.appendChild(content);


      // Assistant के लिए buttons
      if (role === "assistant") {

        const tools =
          document.createElement("div");

        tools.className =
          "message-tools";

        const speakButton =
          document.createElement("button");

        speakButton.className =
          "message-tool";

        speakButton.type =
          "button";

        speakButton.textContent =
          "🔊 सुनें";

        speakButton.onclick =
          function () {
            speakText(String(text || ""));
          };


        const copyButton =
          document.createElement("button");

        copyButton.className =
          "message-tool";

        copyButton.type =
          "button";

        copyButton.textContent =
          "📋 कॉपी";

        copyButton.onclick =
          async function () {

            try {

              await navigator.clipboard.writeText(
                String(text || "")
              );

              setStatus(
                "जवाब कॉपी हो गया।"
              );

              setTimeout(
                () => setStatus(""),
                1500
              );

            } catch (error) {

              setStatus(
                "कॉपी नहीं हो पाया।"
              );
            }
          };


        tools.appendChild(speakButton);
        tools.appendChild(copyButton);

        message.appendChild(tools);
      }


      row.appendChild(message);
      chatBox.appendChild(row);

      chatBox.scrollTop =
        chatBox.scrollHeight;

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

      return message;
    }


    /* =========================
       TYPING INDICATOR
    ========================= */

    function showTyping() {

      removeEmptyMessage();

      const row =
        document.createElement("div");

      row.className =
        "message-row assistant";

      row.id =
        "typingRow";

      const message =
        document.createElement("div");

      message.className =
        "message assistant";

      message.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;

      row.appendChild(message);
      chatBox.appendChild(row);

      chatBox.scrollTop =
        chatBox.scrollHeight;
    }


    function hideTyping() {

      const typing =
        document.getElementById("typingRow");

      if (typing) {
        typing.remove();
      }
    }


    /* =========================
       VOICE OUTPUT
    ========================= */

    function toggleVoice() {

      voiceEnabled =
        !voiceEnabled;

      if (voiceEnabled) {

        voiceButton.classList.add(
          "active"
        );

        setStatus(
          "🔊 सुनें बटन से जवाब की आवाज सुन सकते हो।"
        );

      } else {

        voiceButton.classList.remove(
          "active"
        );

        setStatus(
          "आवाज़ बंद है।"
        );
      }

      setTimeout(
        () => setStatus(""),
        1800
      );
    }


    function speakText(text) {

      if (
        !("speechSynthesis" in window)
      ) {

        setStatus(
          "इस browser में आवाज उपलब्ध नहीं है।"
        );

        return;
      }

      window.speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(
          String(text || "")
        );

      utterance.lang =
        "hi-IN";

      utterance.rate =
        0.95;

      utterance.pitch =
        1;

      const voices =
        window.speechSynthesis.getVoices();

      const hindiVoice =
        voices.find(
          voice =>
            voice.lang &&
            voice.lang
              .toLowerCase()
              .startsWith("hi")
        );

      if (hindiVoice) {
        utterance.voice =
          hindiVoice;
      }

      window.speechSynthesis.speak(
        utterance
      );
    }


    /* =========================
       SEARCH
    ========================= */

    function toggleSearch() {

      useSearch =
        !useSearch;

      if (useSearch) {

        searchButton.classList.add(
          "active"
        );

        searchIndicator.textContent =
          "Search ON";

      } else {

        searchButton.classList.remove(
          "active"
        );

        searchIndicator.textContent =
          "Search OFF";
      }
    }


    /* =========================
       MICROPHONE
       MediaRecorder + Whisper
    ========================= */

    function getSupportedAudioMimeType() {

      const types = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/mp4",
        "audio/ogg;codecs=opus",
        "audio/ogg"
      ];

      for (const type of types) {

        if (
          window.MediaRecorder &&
          MediaRecorder.isTypeSupported(type)
        ) {
          return type;
        }
      }

      return "";
    }


    async function toggleMicrophone() {

      if (isListening) {

        stopRecording();

        return;
      }


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        setStatus(
          "इस browser में microphone उपलब्ध नहीं है।"
        );

        return;
      }


      if (
        !window.MediaRecorder
      ) {

        setStatus(
          "इस browser में audio recording उपलब्ध नहीं है।"
        );

        return;
      }


      try {

        microphoneStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });


        audioChunks = [];


        const mimeType =
          getSupportedAudioMimeType();


        if (mimeType) {

          mediaRecorder =
            new MediaRecorder(
              microphoneStream,
              {
                mimeType
              }
            );

        } else {

          mediaRecorder =
            new MediaRecorder(
              microphoneStream
            );
        }


        mediaRecorder.ondataavailable =
          function (event) {

            if (
              event.data &&
              event.data.size > 0
            ) {

              audioChunks.push(
                event.data
              );
            }
          };


        mediaRecorder.onstop =
          async function () {

            try {

              await processRecordedAudio();

            } catch (error) {

              console.error(
                "Audio processing error:",
                error
              );

              setStatus(
                "आवाज़ समझने में समस्या हुई।"
              );

            } finally {

              if (microphoneStream) {

                microphoneStream
                  .getTracks()
                  .forEach(
                    track => track.stop()
                  );

                microphoneStream =
                  null;
              }
            }
          };


        mediaRecorder.start();

        isListening = true;

        micButton.classList.add(
          "active"
        );

        micButton.textContent =
          "⏹️";

        setStatus(
          "🎤 बोलो... रिकॉर्डिंग चालू है।"
        );


      } catch (error) {

        console.error(
          "Microphone error:",
          error
        );

        isListening = false;

        micButton.classList.remove(
          "active"
        );

        micButton.textContent =
          "🎤";


        if (
          error &&
          error.name ===
            "NotAllowedError"
        ) {

          setStatus(
            "Microphone permission Allow करो।"
          );

        } else {

          setStatus(
            "Microphone शुरू नहीं हो पाया।"
          );
        }
      }
    }


    function stopRecording() {

      if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
      ) {

        mediaRecorder.stop();

      } else {

        isListening = false;

        micButton.classList.remove(
          "active"
        );

        micButton.textContent =
          "🎤";
      }
    }


    /* =========================
       SEND AUDIO TO WORKER
    ========================= */

    async function processRecordedAudio() {

      isListening = false;

      micButton.classList.remove(
        "active"
      );

      micButton.textContent =
        "🎤";


      if (
        audioChunks.length === 0
      ) {

        setStatus(
          "कोई आवाज रिकॉर्ड नहीं हुई।"
        );

        return;
      }


      setStatus(
        "🎧 आवाज को समझ रहा हूँ..."
      );


      const mimeType =
        (
          mediaRecorder &&
          mediaRecorder.mimeType
        ) ||
        "audio/webm";


      const audioBlob =
        new Blob(
          audioChunks,
          {
            type: mimeType
          }
        );


      audioChunks = [];


      const formData =
        new FormData();


      let extension =
        "webm";


      if (
        mimeType.includes("mp4")
      ) {

        extension =
          "mp4";

      } else if (
        mimeType.includes("ogg")
      ) {

        extension =
          "ogg";
      }


      formData.append(
        "file",
        audioBlob,
        "voice." + extension
      );


      const response =
        await fetch(
          API_BASE +
            "/api/transcribe",
          {
            method: "POST",
            body: formData
          }
        );


      const data =
        await response.json()
          .catch(() => ({}));


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Transcription failed"
        );
      }


      const transcript =
        String(
          data.text ||
          data.transcript ||
          ""
        ).trim();


      if (!transcript) {

        setStatus(
          "आवाज़ में कोई शब्द समझ नहीं आया।"
        );

        return;
      }


      input.value =
        transcript;


      autoResizeTextarea();


      setStatus(
        "✅ आवाज समझ ली गई।"
      );


      // आवाज को सीधे सवाल के रूप में भेजना
      await sendMessage();
    }


    /* =========================
       TEXTAREA AUTO RESIZE
    ========================= */

    function autoResizeTextarea() {

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          150
        ) + "px";
    }


    input.addEventListener(
      "input",
      autoResizeTextarea
    );


    /* =========================
       ENTER TO SEND
    ========================= */

    input.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }
      }
    );

        /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage(customText = null) {

      const text =
        String(
          customText !== null
            ? customText
            : input.value
        ).trim();


      if (!text) {
        return;
      }


      input.value = "";
      autoResizeTextarea();


      addMessage(
        "user",
        text
      );


      messages.push({
        role: "user",
        content: text
      });


      showTyping();


      setStatus(
        useSearch
          ? "🌐 Internet Search चल रहा है..."
          : "सारथी सोच रहा है..."
      );


      try {

        const response =
          await fetch(
            API_BASE + "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                messages:
                  messages.slice(-20),
                useSearch:
                  useSearch
              })
            }
          );


        const data =
          await response.json()
            .catch(() => ({}));


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Server error"
          );
        }


        const reply =
          String(
            data.reply ||
            data.content ||
            data.message ||
            ""
          ).trim();


        if (!reply) {

          throw new Error(
            "सारथी का जवाब खाली आया।"
          );
        }


        hideTyping();


        addMessage(
          "assistant",
          reply
        );


        messages.push({
          role: "assistant",
          content: reply
        });


        /*
          IMPORTANT:
          यहाँ speakText(reply) नहीं है।

          इसलिए सारथी अपने-आप नहीं बोलेगा।
          🔊 सुनें दबाने पर ही आवाज आएगी।
        */


        setStatus("");


      } catch (error) {

        console.error(
          "Chat error:",
          error
        );


        hideTyping();


        const errorMessage =
          error &&
          error.message
            ? error.message
            : "कुछ समस्या हो गई।";


        addMessage(
          "assistant",
          "माफ़ करना, अभी जवाब देने में समस्या हुई।\n\n" +
          errorMessage
        );


        setStatus(
          "❌ जवाब नहीं मिल पाया।"
        );


      } finally {

        setTimeout(
          () => setStatus(""),
          2500
        );
      }
    }


    /* =========================
       LOCAL DATE QUESTION
    ========================= */

    function getLocalDateAnswer(text) {

      const normalized =
        String(text || "")
          .toLowerCase()
          .trim();


      const dateWords = [
        "आज का दिन",
        "आज कौन सा दिन",
        "आज की तारीख",
        "आज तारीख",
        "आज क्या तारीख",
        "आज कौन सा डेट",
        "today",
        "date today"
      ];


      const matched =
        dateWords.some(
          word =>
            normalized.includes(word)
        );


      if (!matched) {
        return null;
      }


      const now =
        new Date();


      const days = [
        "रविवार",
        "सोमवार",
        "मंगलवार",
        "बुधवार",
        "गुरुवार",
        "शुक्रवार",
        "शनिवार"
      ];


      const months = [
        "जनवरी",
        "फ़रवरी",
        "मार्च",
        "अप्रैल",
        "मई",
        "जून",
        "जुलाई",
        "अगस्त",
        "सितंबर",
        "अक्टूबर",
        "नवंबर",
        "दिसंबर"
      ];


      return (
        "आज " +
        days[now.getDay()] +
        ", " +
        now.getDate() +
        " " +
        months[now.getMonth()] +
        " " +
        now.getFullYear() +
        " है।"
      );
    }

        );
      }

    function fileToDataURL(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload =
            () => resolve(
              reader.result
            );


          reader.onerror =
            () => reject(
              new Error(
                "File read failed"
              )
            );


          reader.readAsDataURL(file);
        }
      );
    }

    function extractVideoFrame(file) {

      return new Promise(
        (resolve, reject) => {

          const video =
            document.createElement(
              "video"
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          const url =
            URL.createObjectURL(file);


          video.src = url;

          video.muted = true;

          video.playsInline = true;


          video.addEventListener(
            "loadedmetadata",
            function () {

              video.currentTime =
                Math.min(
                  0.5,
                  video.duration || 0
                );
            }
          );


          video.addEventListener(
            "seeked",
            function () {

              try {

                const maxWidth =
                  1280;


                let width =
                  video.videoWidth;


                let height =
                  video.videoHeight;


                if (
                  width > maxWidth
                ) {

                  const ratio =
                    maxWidth /
                    width;

                  width =
                    maxWidth;

                  height =
                    Math.round(
                      height * ratio
                    );
                }


                canvas.width =
                  width;

                canvas.height =
                  height;


                const ctx =
                  canvas.getContext(
                    "2d"
                  );


                ctx.drawImage(
                  video,
                  0,
                  0,
                  width,
                  height
                );


                const dataUrl =
                  canvas.toDataURL(
                    "image/jpeg",
                    0.85
                  );


                URL.revokeObjectURL(
                  url
                );


                resolve(
                  dataUrl
                );

              } catch (error) {

                URL.revokeObjectURL(
                  url
                );

                reject(error);
              }
            }
          );


          video.addEventListener(
            "error",
            function () {

              URL.revokeObjectURL(
                url
              );

              reject(
                new Error(
                  "वीडियो पढ़ा नहीं जा सका।"
                )
              );
            }
          );
        }
      );
    }

          event.target.value =

        }
      );

        setStatus(
          "📎 फाइल पढ़ रहा हूँ..."

          await file.text();

          text.slice(

          "मैंने एक फाइल भेजी है। " +
          "उसकी सामग्री को ध्यान से पढ़कर " +

          "फाइल का नाम: " +
          file.name +
          "\n\n" +
          "फाइल की सामग्री:\n" +
          limitedText;


        removeAttachment();


        await sendMessage(
          prompt

        );


        setStatus(
          "❌ फाइल पढ़ने में समस्या हुई।"
