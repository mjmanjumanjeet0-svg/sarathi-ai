<script>
"use strict";

/* =========================================
   SARATHI AI — SAFER CHAT CLIENT
========================================= */

const API_BASE =
  "https://sarathi-ai.mjmanjumanjeet0.workers.dev";

const MAX_MESSAGE_LENGTH = 4000;
const MAX_HISTORY_ITEMS = 6;
const MAX_HISTORY_CHARS = 1500;
const REQUEST_TIMEOUT_MS = 30000;

let messages = [];
let isSending = false;
let turnstileToken = "";
let turnstileWidgetId = null;

/* Elements */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusBox = document.getElementById("status");

/* Status */
function setStatus(text) {
  if (statusBox) statusBox.textContent = text;
}

/* Escape HTML */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* Clean malformed stars */
function cleanSarathiStars(text) {
  return String(text ?? "")
    .replace(/(\bसारथी)\*+/g, "$1")
    .replace(/\*+(\bसारथी)/g, "$1")
    .replace(/\*{3,}/g, "");
}

/* Safe basic Markdown */
function renderMarkdown(text) {
  let value = escapeHtml(cleanSarathiStars(text));

  const codeBlocks = [];

  value = value.replace(/```([\s\S]*?)```/g, (_, code) => {
    const marker = `___CODE_BLOCK_${codeBlocks.length}___`;
    codeBlocks.push(code);
    return marker;
  });

  value = value.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  value = value.replace(/\n/g, "<br>");

  codeBlocks.forEach((code, index) => {
    value = value.replace(
      `___CODE_BLOCK_${index}___`,
      "<pre><code>" + code + "</code></pre>"
    );
  });

  return value;
}

/* Remove loading animation */
function hideTyping() {
  document.getElementById("typing")?.remove();
}

/* Loading animation */
function showTyping() {
  hideTyping();

  const row = document.createElement("div");
  row.className = "message assistant";
  row.id = "typing";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = "सारथी जवाब तैयार कर रहा है…";

  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

/* Add message safely */
function addMessage(role, text) {
  document.getElementById("empty")?.remove();

  const row = document.createElement("div");
  row.className =
    "message " + (role === "user" ? "user" : "assistant");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = renderMarkdown(text);

  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;

  return row;
}

/* Extract answer */
function extractReply(data) {
  const candidates = [
    data?.answer,
    data?.reply,
    data?.content,
    data?.output_text,
    data?.result?.answer,
    data?.result?.reply
  ];

  for (const item of candidates) {
    if (typeof item === "string" && item.trim()) {
      return item.trim();
    }
  }

  return "";
}

/* Read JSON safely */
async function readResponse(response) {
  const raw = await response.text();

  let data = {};

  try {
    data = raw ? JSON.parse(raw) : {};
  } catch {
    data = {};
  }

  return { data, raw };
}

/* Prepare short, bounded history */
function prepareHistory() {
  return messages
    .slice(-MAX_HISTORY_ITEMS)
    .map(item => ({
      role: item.role === "assistant" ? "assistant" : "user",
      content: String(item.content ?? "").slice(0, MAX_HISTORY_CHARS)
    }));
}

/* Get Turnstile token */
function getTurnstileToken() {
  if (!turnstileToken) {
    throw new Error(
      "सुरक्षा जाँच पूरी नहीं हुई। कृपया Turnstile जाँच पूरी करें।"
    );
  }

  return turnstileToken;
}

/* Send chat message */
async function sendMessage() {
  if (isSending) return;

  const text = String(input.value ?? "").trim();

  if (!text) return;

  if (text.length > MAX_MESSAGE_LENGTH) {
    setStatus("संदेश बहुत लंबा है। कृपया 4000 अक्षरों के भीतर रखें।");
    return;
  }

  let token;

  try {
    token = getTurnstileToken();
  } catch (error) {
    setStatus(error.message);
    return;
  }

  isSending = true;
  sendBtn.disabled = true;
  input.disabled = true;

  input.value = "";

  addMessage("user", text);

  const history = prepareHistory();

  messages.push({
    role: "user",
    content: text
  });

  showTyping();
  setStatus("सारथी से सुरक्षित कनेक्शन बनाया जा रहा है…");

  const controller = new AbortController();
  const timeout = setTimeout(
    () => controller.abort(),
    REQUEST_TIMEOUT_MS
  );

  try {
    const response = await fetch(API_BASE + "/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        history,
        turnstileToken: token
      }),
      signal: controller.signal,
      cache: "no-store",
      credentials: "omit"
    });

    const result = await readResponse(response);

    if (!response.ok) {
      /*
       * Do not show raw server response.
       * Keep private technical details out of the chat.
       */
      if (response.status === 403) {
        throw new Error("सुरक्षा जाँच असफल हुई। दोबारा प्रयास करें।");
      }

      if (response.status === 429) {
        throw new Error("बहुत अधिक अनुरोध हुए हैं। थोड़ी देर बाद प्रयास करें।");
      }

      if (response.status === 503) {
        throw new Error("AI सेवा अभी उपलब्ध नहीं है। बाद में प्रयास करें।");
      }

      throw new Error("सर्वर से जवाब नहीं मिल पाया। कृपया बाद में प्रयास करें।");
    }

    const reply = extractReply(result.data);

    if (!reply) {
      throw new Error("सर्वर से खाली जवाब मिला।");
    }

    const cleanReply = cleanSarathiStars(reply);

    hideTyping();
    addMessage("assistant", cleanReply);

    messages.push({
      role: "assistant",
      content: cleanReply
    });

    /* Keep local memory bounded */
    messages = messages.slice(-MAX_HISTORY_ITEMS);

    setStatus("सारथी तैयार है।");

  } catch (error) {
    hideTyping();

    if (error.name === "AbortError") {
      setStatus("जवाब आने में समय लगा। कृपया दोबारा प्रयास करें।");
      addMessage("assistant", "अभी जवाब नहीं मिल पाया। कृपया दोबारा प्रयास करें।");
    } else {
      setStatus(error.message || "कनेक्शन में समस्या हुई।");
      addMessage("assistant", error.message || "कनेक्शन में समस्या हुई।");
    }

  } finally {
    clearTimeout(timeout);

    /*
     * Turnstile tokens are single-use.
     * Reset after each request so a fresh token is required.
     */
    turnstileToken = "";

    if (
      window.turnstile &&
      turnstileWidgetId !== null
    ) {
      try {
        window.turnstile.reset(turnstileWidgetId);
      } catch {
        /* Widget may not be ready yet. */
      }
    }

    isSending = false;
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

/* Turnstile callbacks */
function onSarathiTurnstileSuccess(token) {
  turnstileToken = String(token || "");
  setStatus("सुरक्षा जाँच पूरी हुई। सारथी तैयार है।");
}

function onSarathiTurnstileExpired() {
  turnstileToken = "";
  setStatus("सुरक्षा टोकन समाप्त हुआ। दोबारा जाँच करें।");
}

function onSarathiTurnstileError() {
  turnstileToken = "";
  setStatus("सुरक्षा जाँच लोड नहीं हुई। इंटरनेट कनेक्शन जाँचें।");
}

/*
 * IMPORTANT:
 * Turnstile must be rendered using your real public Site Key.
 * Do not place the Turnstile secret or Groq API key in HTML.
 */
function initializeTurnstile() {
  if (!window.turnstile) {
    setStatus("सुरक्षा जाँच लोड हो रही है…");
    return;
  }

  const container = document.getElementById("turnstile-widget");

  if (!container) {
    setStatus("सुरक्षा जाँच का स्थान नहीं मिला।");
    return;
  }

  if (turnstileWidgetId !== null) return;

  const siteKey = "PASTE_YOUR_PUBLIC_TURNSTILE_SITE_KEY_HERE";

  if (
    !siteKey ||
    siteKey === "PASTE_YOUR_PUBLIC_TURNSTILE_SITE_KEY_HERE"
  ) {
    setStatus("Turnstile की सार्वजनिक Site Key डालना बाकी है।");
    return;
  }

  turnstileWidgetId = window.turnstile.render(container, {
    sitekey: siteKey,
    callback: onSarathiTurnstileSuccess,
    "expired-callback": onSarathiTurnstileExpired,
    "error-callback": onSarathiTurnstileError,
    theme: "light"
  });
}

/* Clear chat */
function clearChat() {
  if (!confirm("क्या नई चैट शुरू करनी है?")) return;

  messages = [];
  hideTyping();

  chat.innerHTML = `
    <div id="empty" class="empty">
      <strong>हेलो 👋</strong>
      मैं सारथी AI हूँ।<br>
      अपना सवाल लिखो।
    </div>
  `;

  setStatus("नई चैट शुरू हो गई।");
}

/* Disable unsupported features safely */
function startRecording() {
  setStatus("आवाज़ वाला फीचर सुरक्षित API तैयार होने तक बंद है।");
}

function toggleSearch() {
  setStatus("वेब Search को चालू करने के लिए Worker में सुरक्षित Search सुविधा जोड़नी होगी।");
}

function toggleVoice() {
  setStatus("आवाज़ में जवाब पढ़ने के लिए नीचे ब्राउज़र की आवाज़ सुविधा जोड़ी जा सकती है।");
}

function openStudy() {
  window.location.href = "/study.html";
}

/* Enter sends message; Shift+Enter adds a line */
input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

/* Startup */
window.addEventListener("load", () => {
  initializeTurnstile();
  input.focus();
});

/* Turnstile script may load after the page */
window.addEventListener("pageshow", initializeTurnstile);
</script>
