<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Saarthi AI — आपका डिजिटल साथी</title>
  <meta name="description" content="Saarthi AI आपका हिंदी AI सहायक है।">

  <style>
    :root {
      font-family: system-ui, "Noto Sans Devanagari", sans-serif;
      color: #172033;
      background: #f3f6fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    button, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 100vh;
      height: 100dvh;
      min-height: 480px;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border-bottom: 1px solid #e1e6ef;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border-radius: 13px;
      background: #3157d5;
      color: #fff;
      font-weight: 800;
      font-size: 23px;
    }

    h1 {
      margin: 0;
      font-size: 19px;
    }

    .subtitle, .hint {
      color: #68738a;
      font-size: 12px;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .small-btn {
      padding: 8px 10px;
      border: 1px solid #dfe5ef;
      border-radius: 9px;
      background: #fff;
    }

    #status {
      padding: 9px 14px;
      background: #fafbfe;
      color: #59657b;
      font-size: 12px;
      border-bottom: 1px solid #e8ebf2;
      overflow-wrap: anywhere;
    }

    #status.error {
      color: #b42318;
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
    }

    .empty {
      max-width: 400px;
      margin: 10vh auto;
      text-align: center;
      line-height: 1.9;
      color: #68738a;
    }

    .empty strong {
      display: block;
      font-size: 25px;
      color: #172033;
    }

    .message {
      display: flex;
      margin: 12px 0;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 90%;
      padding: 12px 14px;
      border-radius: 15px;
      line-height: 1.75;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #3157d5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background: #eef2fa;
      color: #172033;
      border-bottom-left-radius: 4px;
      white-space: normal;
    }

    .bubble strong {
      font-weight: 750;
    }

    .bubble code {
      font-family: monospace;
      overflow-wrap: anywhere;
    }

    .bubble pre {
      padding: 10px;
      border-radius: 8px;
      background: #e1e6ef;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .composer-area {
      padding: 12px;
      border-top: 1px solid #e1e6ef;
    }

    .security-box {
      display: flex;
      justify-content: center;
      min-height: 0;
      margin-bottom: 10px;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      border: 1px solid #dfe5ef;
      border-radius: 15px;
    }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      max-height: 130px;
      resize: vertical;
      padding: 10px;
      border: 0;
      outline: none;
    }

    #sendBtn {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 11px;
      background: #3157d5;
      color: #fff;
      font-weight: 700;
    }

    .hint {
      text-align: center;
      line-height: 1.7;
      margin: 9px 0 0;
    }

    @media (max-width: 480px) {
      header {
        padding: 10px;
      }

      h1 {
        font-size: 17px;
      }

      .small-btn {
        padding: 7px;
        font-size: 12px;
      }

      #chat {
        padding: 11px;
      }
    }
  </style>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer
  ></script>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">S</div>
        <div>
          <h1>Saarthi AI</h1>
          <div class="subtitle">आपका डिजिटल साथी</div>
        </div>
      </div>

      <div class="header-actions">
        <button id="studyBtn" class="small-btn" type="button">
          पढ़ाई
        </button>
        <button id="clearBtn" class="small-btn" type="button">
          नई चैट
        </button>
      </div>
    </header>

    <div id="status" role="status" aria-live="polite">
      Cloudflare सुरक्षा जाँच लोड हो रही है…
    </div>

    <section id="chat" aria-label="सारथी चैट">
      <div id="empty" class="empty">
        <strong>नमस्ते! 👋</strong>
        मैं सारथी AI हूँ।<br>
        अपना सवाल नीचे लिखें।
      </div>
    </section>

    <footer class="composer-area">
      <div class="security-box">
        <div id="turnstile-widget"></div>
      </div>

      <form id="chatForm" class="composer">
        <textarea
          id="input"
          maxlength="4000"
          placeholder="अपना सवाल यहाँ लिखें…"
          aria-label="अपना सवाल"
          required
        ></textarea>

        <button id="sendBtn" type="submit">भेजें</button>
      </form>

      <p class="hint">
        जवाब AI द्वारा तैयार किए जाते हैं। जरूरी जानकारी की जाँच करें।
        <br>
        चैट का इतिहास पेज बंद करने पर मिट जाएगा।
      </p>
    </footer>
  </main>

  <script>
    "use strict";

    const API_BASE =
      "https://sarathi-ai.mjmanjumanjeet0.workers.dev";

    const SITE_KEY =
      "PASTE_YOUR_PUBLIC_TURNSTILE_SITE_KEY_HERE";

    const MAX_MESSAGE_LENGTH = 4000;
    const MAX_HISTORY_ITEMS = 6;
    const MAX_HISTORY_CHARS = 1500;
    const TIMEOUT_MS = 30000;

    let messages = [];
    let busy = false;
    let turnstileToken = "";
    let widgetId = null;

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const statusBox = document.getElementById("status");

    function setStatus(text, error = false) {
      statusBox.textContent = text;
      statusBox.classList.toggle("error", error);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderReply(text) {
      /*
       * Escape all HTML before applying basic Markdown.
       * Never interpret AI output as trusted HTML.
       */
      let value = escapeHtml(text);
      const blocks = [];

      value = value.replace(/```([\s\S]*?)```/g, (_, code) => {
        const marker = `SARATHICODE${blocks.length}END`;
        blocks.push(code);
        return marker;
      });

      value = value.replace(
        /`([^`\n]+)`/g,
        "<code>$1</code>"
      );

      value = value.replace(
        /\*\*([^*]+)\*\*/g,
        "<strong>$1</strong>"
      );

      value = value.replace(/\n/g, "<br>");

      blocks.forEach((code, index) => {
        value = value.replace(
          `SARATHICODE${index}END`,
          "<pre><code>" + code + "</code></pre>"
        );
      });

      return value;
    }

    function addMessage(role, text) {
      document.getElementById("empty")?.remove();

      const row = document.createElement("div");
      row.className = "message " + role;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "user") {
        bubble.textContent = text;
      } else {
        bubble.innerHTML = renderReply(text);
      }

      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      hideTyping();

      const row = document.createElement("div");
      row.id = "typing";
      row.className = "message assistant";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = "सारथी जवाब तैयार कर रहा है…";

      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      document.getElementById("typing")?.remove();
    }

    function prepareHistory() {
      return messages.slice(-MAX_HISTORY_ITEMS).map(item => ({
        role: item.role,
        content: item.content.slice(0, MAX_HISTORY_CHARS)
      }));
    }

    function onTurnstileSuccess(token) {
      turnstileToken = String(token || "");
      setStatus("सुरक्षा जाँच पूरी हुई। सारथी तैयार है।");
    }

    function onTurnstileExpired() {
      turnstileToken = "";
      setStatus("सुरक्षा टोकन समाप्त हो गया। दोबारा जाँच करें।", true);
    }

    function onTurnstileError() {
      turnstileToken = "";
      setStatus("सुरक्षा जाँच लोड नहीं हुई। इंटरनेट जाँचें।", true);
    }

    function initializeTurnstile() {
      if (widgetId !== null) return;

      if (
        !SITE_KEY ||
        SITE_KEY === "PASTE_YOUR_PUBLIC_TURNSTILE_SITE_KEY_HERE"
      ) {
        setStatus("Turnstile Public Site Key डालना बाकी है।", true);
        return;
      }

      if (!window.turnstile) {
        setStatus("Cloudflare सुरक्षा जाँच लोड हो रही है…");
        return;
      }

      const container = document.getElementById("turnstile-widget");

      if (!container) {
        setStatus("सुरक्षा जाँच का स्थान नहीं मिला।", true);
        return;
      }

      try {
        widgetId = window.turnstile.render(container, {
          sitekey: SITE_KEY,
          callback: onTurnstileSuccess,
          "expired-callback": onTurnstileExpired,
          "error-callback": onTurnstileError,
          theme: "light"
        });
      } catch {
        setStatus("सुरक्षा जाँच शुरू नहीं हो सकी।", true);
      }
    }

    async function sendMessage() {
      if (busy) return;

      const text = input.value.trim();

      if (!text) return;

      if (text.length > MAX_MESSAGE_LENGTH) {
        setStatus("संदेश 4000 अक्षरों के भीतर रखें।", true);
        return;
      }

      if (!turnstileToken) {
        setStatus("पहले Cloudflare सुरक्षा जाँच पूरी करें।", true);
        return;
      }

      busy = true;
      sendBtn.disabled = true;
      input.disabled = true;

      const token = turnstileToken;
      turnstileToken = "";

      input.value = "";
      addMessage("user", text);

      const history = prepareHistory();

      messages.push({
        role: "user",
        content: text
      });

      showTyping();
      setStatus("सारथी से सुरक्षित कनेक्शन बनाया जा रहा है…");

      const controller = new AbortController();
      const timeoutId = setTimeout(
        () => controller.abort(),
        TIMEOUT_MS
      );

      try {
        const response = await fetch(API_BASE + "/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text,
            history,
            turnstileToken: token
          }),
          credentials: "omit",
          cache: "no-store",
          redirect: "error",
          signal: controller.signal
        });

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          if (response.status === 403) {
            throw new Error("सुरक्षा जाँच असफल हुई। दोबारा प्रयास करें।");
          }

          if (response.status === 429) {
            throw new Error("बहुत अधिक अनुरोध हुए हैं। थोड़ी देर प्रतीक्षा करें।");
          }

          if (response.status === 503) {
            throw new Error("AI सेवा अभी उपलब्ध नहीं है। बाद में प्रयास करें।");
          }

          throw new Error("सर्वर से जवाब नहीं मिला।");
        }

        const reply = [
          data?.answer,
          data?.reply,
          data?.content,
          data?.output_text,
          data?.result?.answer
        ].find(value =>
          typeof value === "string" && value.trim()
        );

        if (!reply) {
          throw new Error("सर्वर से खाली जवाब मिला।");
        }

        addMessage("assistant", reply.trim());

        messages.push({
          role: "assistant",
          content: reply.trim()
        });

        messages = messages.slice(-MAX_HISTORY_ITEMS);
        setStatus("सारथी तैयार है।");

      } catch (error) {
        hideTyping();

        const message =
          error.name === "AbortError"
            ? "जवाब आने में समय लगा। दोबारा प्रयास करें।"
            : error instanceof TypeError
              ? "कनेक्शन में समस्या है। इंटरनेट और Worker जाँचें।"
              : error.message || "कनेक्शन में समस्या हुई।";

        setStatus(message, true);
        addMessage("assistant", message);

      } finally {
        clearTimeout(timeoutId);
        hideTyping();

        if (window.turnstile && widgetId !== null) {
          try {
            window.turnstile.reset(widgetId);
          } catch {
            // Token will remain empty until a fresh success callback.
          }
        }

        busy = false;
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    document.getElementById("chatForm").addEventListener(
      "submit",
      event => {
        event.preventDefault();
        sendMessage();
      }
    );

    document.getElementById("clearBtn").addEventListener(
      "click",
      () => {
        if (busy) {
          setStatus("पहले चल रहे जवाब के पूरा होने की प्रतीक्षा करें।");
          return;
        }

        if (!confirm("क्या नई चैट शुरू करनी है?")) return;

        messages = [];
        hideTyping();

        chat.replaceChildren();

        const empty = document.createElement("div");
        empty.id = "empty";
        empty.className = "empty";

        const title = document.createElement("strong");
        title.textContent = "नमस्ते! 👋";

        empty.appendChild(title);
        empty.appendChild(
          document.createTextNode("मैं सारथी AI हूँ। अपना सवाल नीचे लिखें।")
        );

        chat.appendChild(empty);
        setStatus("नई चैट शुरू हो गई।");
      }
    );

    document.getElementById("studyBtn").addEventListener(
      "click",
      () => {
        window.location.href = "/study.html";
      }
    );

    window.addEventListener("load", initializeTurnstile);
    window.addEventListener("pageshow", initializeTurnstile);

    let retries = 0;

    const retryTimer = setInterval(() => {
      if (widgetId !== null || retries >= 15) {
        clearInterval(retryTimer);
        return;
      }

      retries++;
      initializeTurnstile();
    }, 1000);
  </script>
</body>
</html>
