    type="file"

<script>

/* =========================================================
   CONFIG
========================================================= */

const API_BASE =
  "https://sarathi-ai.mjmanjumanjeet0.workers.dev";


/* =========================================================
   STATE
========================================================= */

let messages = [];
let useSearch = false;
let voiceEnabled = false;

let isSending = false;
let isListening = false;

let mediaRecorder = null;
let audioChunks = [];
let microphoneStream = null;


/* =========================================================
   ELEMENTS
========================================================= */

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusBox = document.getElementById("status");
const searchBtn = document.getElementById("searchBtn");
const voiceBtn = document.getElementById("voiceBtn");
const empty = document.getElementById("empty");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){
  statusBox.textContent = text || "";
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   SARATHI *** FIX
========================================================= */

function cleanSarathiStars(text){

  let value = String(text ?? "");

  /*
    सारथी*** 
    ***सारथी
    ***सारथी***
    जैसी समस्या हटाएँ।
  */

  value = value.replace(/(\bसारथी)\*+/g,"$1");
  value = value.replace(/\*+(\bसारथी)/g,"$1");

  /*
    तीन या उससे ज्यादा लगातार * हटाएँ।
    इससे *** जैसी खराब formatting नहीं दिखेगी।
  */

  value = value.replace(/\*{3,}/g,"");

  return value;
}


/* =========================================================
   SIMPLE MARKDOWN
========================================================= */

function renderMarkdown(text){

  let value = cleanSarathiStars(text);

  value = escapeHtml(value);

  /*
    Code blocks
  */

  const codeBlocks = [];

  value = value.replace(
    /```([\s\S]*?)```/g,
    function(_, code){
      const id = "___CODE_BLOCK_" + codeBlocks.length + "___";
      codeBlocks.push(code);
      return id;
    }
  );

  /*
    Inline code
  */

  value = value.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  /*
    Bold
  */

  value = value.replace(
    /\*\*([^*]+)\*\*/g,
    "<strong>$1</strong>"
  );

  /*
    Italic
  */

  value = value.replace(
    /(^|[^\*])\*([^*\n]+)\*(?!\*)/g,
    "$1<em>$2</em>"
  );

  /*
    Headings
  */

  value = value.replace(
    /^### (.*)$/gm,
    "<strong>$1</strong>"
  );

  value = value.replace(
    /^## (.*)$/gm,
    "<strong>$1</strong>"
  );

  value = value.replace(
    /^# (.*)$/gm,
    "<strong>$1</strong>"
  );

  /*
    Bullets
  */

  value = value.replace(
    /^[•\-] (.*)$/gm,
    "• $1"
  );

  /*
    New lines
  */

  value = value.replace(/\n/g,"<br>");

  /*
    Restore code blocks
  */

  codeBlocks.forEach(function(code,index){

    const safeCode = escapeHtml(code);

    value = value.replace(
      "___CODE_BLOCK_" + index + "___",
      "<pre><code>" + safeCode + "</code></pre>"
    );

  });

  return value;
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(role,text,extra=""){

  if(empty){
    empty.style.display = "none";
  }

  const row = document.createElement("div");

  row.className =
    "message " + (role === "user" ? "user" : "assistant");

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  if(role === "assistant"){

    bubble.innerHTML =
      renderMarkdown(text) +
      `
      <div class="actions">

        <button onclick="speakText(this)">
          🔊 सुनें
        </button>

        <button onclick="copyText(this)">
          📋 कॉपी
        </button>

      </div>
      `;

  }else{

    bubble.innerHTML =
      renderMarkdown(text) + extra;

  }

  row.appendChild(bubble);
  chat.appendChild(row);

  chat.scrollTop = chat.scrollHeight;

  return row;
}


/* =========================================================
   TYPING
========================================================= */

function showTyping(){

  hideTyping();

  const row = document.createElement("div");

  row.className = "message assistant";
  row.id = "typing";

  row.innerHTML = `
    <div class="bubble">
      <div class="typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  `;

  chat.appendChild(row);

  chat.scrollTop = chat.scrollHeight;
}


function hideTyping(){

  const old = document.getElementById("typing");

  if(old){
    old.remove();
  }

}


/* =========================================================
   COPY
========================================================= */

async function copyText(button){

  const bubble = button.closest(".bubble");

  if(!bubble) return;

  const clone = bubble.cloneNode(true);

  clone.querySelectorAll(".actions").forEach(
    el => el.remove()
  );

  const text = clone.innerText.trim();

  try{

    await navigator.clipboard.writeText(text);

    button.textContent = "✅ कॉपी";

    setTimeout(()=>{
      button.textContent = "📋 कॉपी";
    },1200);

  }catch{

    setStatus("कॉपी नहीं हो सका।");

  }
}


/* =========================================================
   SPEAK
========================================================= */

function speakText(button){

  const bubble = button.closest(".bubble");

  if(!bubble) return;

  const clone = bubble.cloneNode(true);

  clone.querySelectorAll(".actions").forEach(
    el => el.remove()
  );

  const text = clone.innerText.trim();

  if(!text) return;

  if(!("speechSynthesis" in window)){

    setStatus(
      "इस फोन के ब्राउज़र में आवाज़ चलाने की सुविधा उपलब्ध नहीं है।"
    );

    return;
  }

  speechSynthesis.cancel();

  const speak = () => {

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "hi-IN";
    utterance.rate = 0.92;
    utterance.pitch = 1;
    utterance.volume = 1;

    const voices =
      speechSynthesis.getVoices();

    const hindiVoice =
      voices.find(v =>
        /^hi(-|_)/i.test(v.lang)
      ) ||
      voices.find(v =>
        /hindi/i.test(v.name)
      );

    if(hindiVoice){
      utterance.voice = hindiVoice;
    }

    utterance.onstart = () => {
      setStatus("🔊 जवाब पढ़ रहा हूँ...");
    };

    utterance.onend = () => {
      setStatus("तैयार है।");
    };

    utterance.onerror = (event) => {
      console.error(
        "Speech synthesis error:",
        event
      );

      setStatus(
        "⚠️ आवाज़ चलाने में समस्या हुई।"
      );
    };

    speechSynthesis.speak(utterance);
  };

  const voices =
    speechSynthesis.getVoices();

  if(voices.length){

    speak();

  }else{

    speechSynthesis.onvoiceschanged = () => {

      speechSynthesis.onvoiceschanged = null;

      speak();

    };
  }
}

/* =========================================================
   VOICE TOGGLE
========================================================= */

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  voiceBtn.textContent =
    voiceEnabled
      ? "🔊 आवाज ON"
      : "🔊 आवाज OFF";

  voiceBtn.classList.toggle(
    "active",
    voiceEnabled
  );

  setStatus(
    voiceEnabled
      ? "आवाज ON है। जवाब के नीचे 🔊 सुनें दबा सकते हो।"
      : "आवाज OFF है।"
  );
}


/* =========================================================
   SEARCH
========================================================= */

function toggleSearch(){

  useSearch = !useSearch;

  searchBtn.textContent =
    useSearch
      ? "🌐 Search ON"
      : "🌐 Search OFF";

  searchBtn.classList.toggle(
    "active",
    useSearch
  );

  setStatus(
    useSearch
      ? "🌐 इंटरनेट Search ON है।"
      : "Search OFF है।"
  );
}


/* =========================================================
   TEXTAREA
========================================================= */

function autoResize(){

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight,130) + "px";
}

input.addEventListener(
  "input",
  autoResize
);

input.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter" && !e.shiftKey){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   LOCAL DATE ANSWER
========================================================= */

function getLocalDateAnswer(text){

  const q = String(text).trim().toLowerCase();

  const patterns = [
    "आज कौन सा दिन",
    "आज कौन-सा दिन",
    "आज का दिन",
    "आज क्या दिन",
    "आज कौन सा वार",
    "आज कौन-सा वार",
    "आज की तारीख",
    "आज तारीख क्या है",
    "आज की डेट"
  ];

  const matched =
    patterns.some(p => q.includes(p));

  if(!matched){
    return null;
  }

  const now = new Date();

  const day =
    now.toLocaleDateString(
      "hi-IN",
      {weekday:"long"}
    );

  const date =
    now.toLocaleDateString(
      "hi-IN",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  return `आज ${day} है और तारीख ${date} है।`;

}


/* =========================================================
   READ JSON RESPONSE SAFELY
========================================================= */

async function readResponse(response){

  const raw = await response.text();

  let data = {};

  try{

    data =
      raw
        ? JSON.parse(raw)
        : {};

  }catch{

    data = {};

  }

  return {
    data,
    raw
  };

}


/* =========================================================
   EXTRACT AI REPLY
========================================================= */

function extractReply(data){

  const candidates = [
    data?.answer,
    data?.reply,
    data?.content,
    data?.message,
    data?.output_text,
    data?.result?.answer,
    data?.result?.reply,
    data?.result?.content
  ];

  for(const item of candidates){

    if(
      typeof item === "string" &&
      item.trim()
    ){
      return item.trim();
    }

  }

  return "";
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(customText=null,displayText=null){

  if(isSending){

    return;

  }

  const text =
    String(
      customText !== null
        ? customText
        : input.value
    ).trim();

  if(!text){

    return;

  }

  isSending = true;

  sendBtn.disabled = true;

  if(customText === null){

    input.value = "";

    autoResize();

  }

  const shownText =
    displayText !== null
      ? displayText
      : text;

  addMessage(
    "user",
    shownText
  );

  messages.push({
    role:"user",
    content:text
  });

  /*
    Local date questions को Worker पर भेजने की जरूरत नहीं।
  */

  if(!useSearch){

    const localAnswer =
      getLocalDateAnswer(text);

    if(localAnswer){

      addMessage(
        "assistant",
        localAnswer
      );

      messages.push({
        role:"assistant",
        content:localAnswer
      });

      setStatus("तैयार है।");

      isSending = false;

      sendBtn.disabled = false;

      return;
    }

  }


  showTyping();

  setStatus(
    useSearch
      ? "🌐 इंटरनेट से जानकारी खोज रहा हूँ..."
      : "सारथी सोच रहा है..."
  );


  /*
    60 सेकंड timeout
  */

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      ()=>controller.abort(),
      60000
    );


  try{

    const response =
      await fetch(
        API_BASE + "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

  message: text,

  history:
    messages.slice(-12),

  webSearch:
    Boolean(useSearch)

}),

          signal:
            controller.signal

        }
      );


    const result =
      await readResponse(response);

    const data =
      result.data;

    const raw =
      result.raw;


    if(!response.ok){

      const serverError =
        data?.error ||
        data?.message ||
        raw ||
        `HTTP ${response.status}`;

      throw new Error(
        `सर्वर त्रुटि (${response.status}): ${serverError}`
      );

    }


    const reply =
      extractReply(data);


    if(!reply){

      throw new Error(
        "Worker ने खाली जवाब भेजा।"
      );

    }


    /*
      *** वाली समस्या यहाँ भी साफ होगी।
    */

    const cleanReply =
      cleanSarathiStars(reply);


    hideTyping();

    addMessage(
      "assistant",
      cleanReply
    );

    messages.push({
      role:"assistant",
      content:cleanReply
    });


    setStatus(
      useSearch
        ? "🌐 Search के साथ जवाब दिया गया।"
        : "तैयार है।"
    );


    /*
      Auto voice सिर्फ तभी जब user ने ON किया हो।
    */

    if(
      voiceEnabled &&
      "speechSynthesis" in window
    ){

      const utterance =
        new SpeechSynthesisUtterance(
          cleanReply
        );

      utterance.lang = "hi-IN";
      utterance.rate = 0.92;

      speechSynthesis.cancel();

      speechSynthesis.speak(
        utterance
      );

    }


  }catch(error){

    hideTyping();

    console.error(
      "Sarathi chat error:",
      error
    );


    let message =
      "माफ़ करना, अभी जवाब देने में समस्या हुई।";


    if(error?.name === "AbortError"){

      message =
        "सर्वर से जवाब आने में बहुत समय लग गया। इंटरनेट या Worker को जाँचो।";

    }else if(
      error?.message
    ){

      /*
        Debugging के लिए असली error भी दिखाएँ।
      */

      message =
        "माफ़ करना, जवाब नहीं मिल पाया।\n\n" +
        "तकनीकी जानकारी: " +
        error.message;

    }


    addMessage(
      "assistant",
      message
    );

    setStatus(
      "⚠️ Chat request में समस्या हुई।"
    );


  }finally{

    clearTimeout(timeout);

    isSending = false;

    sendBtn.disabled = false;

  }

}


/* =========================================================
   MICROPHONE / WHISPER
========================================================= */

async function startRecording(){

  if(isListening){

    stopRecording();

    return;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    setStatus(
      "इस ब्राउज़र में Microphone उपलब्ध नहीं है।"
    );

    return;

  }


  try{

    microphoneStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });


    audioChunks = [];


    mediaRecorder =
      new MediaRecorder(
        microphoneStream
      );


    mediaRecorder.ondataavailable =
      function(e){

        if(e.data.size > 0){

          audioChunks.push(
            e.data
          );

        }

      };


    mediaRecorder.onstop =
      async function(){

        try{

          const blob =
            new Blob(
              audioChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );


          setStatus(
            "🎙️ आवाज को text में बदल रहा हूँ..."
          );


          const formData =
            new FormData();

          formData.append(
            "file",
            blob,
            "voice.webm"
          );


          const response =
            await fetch(
              API_BASE + "/api/transcribe",
              {
                method:"POST",
                body:formData
              }
            );


          const result =
            await readResponse(response);


          if(!response.ok){

            throw new Error(
              result.data?.error ||
              result.data?.message ||
              result.raw ||
              `HTTP ${response.status}`
            );

          }


          const text =
            result.data?.text ||
            result.data?.transcript ||
            "";


          if(!text.trim()){

            throw new Error(
              "आवाज समझ में नहीं आई।"
            );

          }


          input.value =
            text.trim();

          autoResize();

          setStatus(
            "🎙️ आवाज समझ ली गई।"
          );


          /*
            Transcription के बाद message भेजें।
          */

          sendMessage();


        }catch(error){

          console.error(
            "Transcription error:",
            error
          );

          setStatus(
            "🎙️ आवाज समझने में समस्या: " +
            error.message
          );

        }

      };


    mediaRecorder.start();

    isListening = true;

    setStatus(
      "🔴 सुन रहा हूँ... बोलना पूरा होने पर फिर 🎙️ दबाएँ।"
    );


  }catch(error){

    console.error(error);

    setStatus(
      "Microphone permission नहीं मिली।"
    );

  }

}


function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ){

    mediaRecorder.stop();

  }


  if(microphoneStream){

    microphoneStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    microphoneStream = null;

  }


  isListening = false;

}

/* =========================================================

========================================================= */

document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    handleFile
  );


async function handleFile(e){

  const file = e.target.files?.[0];

  if(!file) return;

  try{

    const ext = file.name
      .split(".")
      .pop()
      .toLowerCase();

    const allowed = [
      "txt",
      "csv",
      "json",
      "md",
      "pdf",
      "docx"
    ];

    if(!allowed.includes(ext)){
      throw new Error(
        "TXT, CSV, JSON, MD, PDF और DOCX फाइल ही supported हैं।"
      );
    }

    let text = "";

    if(
      ext === "txt" ||
      ext === "csv" ||
      ext === "json" ||
      ext === "md"
    ){

      text = await file.text();

    }

    else if(ext === "pdf"){

      if(!window.pdfjsLib){
        throw new Error(
          "PDF reader load नहीं हुआ। पेज को फिर से खोलें।"
        );
      }

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const arrayBuffer =
        await file.arrayBuffer();

      const pdf =
        await pdfjsLib.getDocument({
          data: arrayBuffer
        }).promise;

      const pages = [];

      for(
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ){

        const page =
          await pdf.getPage(pageNumber);

        const content =
          await page.getTextContent();

        const pageText =
          content.items
            .map(item =>
              typeof item.str === "string"
                ? item.str
                : ""
            )
            .join(" ");

        pages.push(
          `पेज ${pageNumber}:\n${pageText}`
        );
      }

      text = pages.join("\n\n");

    }

    else if(ext === "docx"){

      if(!window.mammoth){
        throw new Error(
          "DOCX reader load नहीं हुआ। पेज को फिर से खोलें।"
        );
      }

      const arrayBuffer =
        await file.arrayBuffer();

      const result =
        await mammoth.extractRawText({
          arrayBuffer
        });

      text = result.value || "";

    }

    if(!text.trim()){
      throw new Error(
        "फाइल में पढ़ने योग्य text नहीं मिला।"
      );
    }

    const display =
      `📄 ${file.name} पढ़ रहा हूँ।`;

    const prompt = `
मैंने "${file.name}" नाम की फाइल भेजी है।

फाइल का content:

--------------------

${text.slice(0,30000)}

--------------------

इस फाइल को ध्यान से पढ़कर मेरे सवाल/निर्देश के अनुसार आसान हिंदी में उत्तर दो।

फाइल में जो जानकारी उपलब्ध नहीं है उसे मत गढ़ो।
यदि फाइल बहुत बड़ी है तो मेरे सवाल से संबंधित जानकारी पर ध्यान दो।
`;

    await sendMessage(
      prompt,
      display
    );

  }catch(error){

    console.error(
      "File error:",
      error
    );

    addMessage(
      "assistant",
      "फाइल पढ़ने में समस्या हुई।\n\n" +
      (error?.message || "अज्ञात समस्या")
    );

  }finally{

    e.target.value = "";

  }

}

function fileToDataURL(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        ()=>resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   VIDEO FRAME
========================================================= */

function getVideoFrame(file){

  return new Promise(
    function(resolve,reject){

      const video =
        document.createElement("video");

      const url =
        URL.createObjectURL(file);

      video.src = url;

      video.muted = true;

      video.playsInline = true;

      video.onloadeddata =
        function(){

          video.currentTime = 0.1;

        };


      video.onseeked =
        function(){

          try{

            const canvas =
              document.createElement(
                "canvas"
              );

            canvas.width =
              video.videoWidth;

            canvas.height =
              video.videoHeight;


            const ctx =
              canvas.getContext("2d");


            ctx.drawImage(
              video,
              0,
              0,
              canvas.width,
              canvas.height
            );


            const data =
              canvas.toDataURL(
                "image/jpeg",
                0.85
              );


            URL.revokeObjectURL(
              url
            );


            resolve(data);


          }catch(error){

            URL.revokeObjectURL(
              url
            );

            reject(error);

          }

        };


      video.onerror =
        function(){

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "वीडियो पढ़ा नहीं जा सका।"
            )
          );

        };

    }
  );

}
