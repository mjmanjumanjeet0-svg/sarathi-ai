<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>सारथी AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f7f8fc;
      color: #172033;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 950px;
      margin: auto;

      padding: 10px 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 20px;
      font-weight: 800;
    }

    /* Sarathi icon */

    .sarathi-icon {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      background:
        linear-gradient(135deg, #6366f1, #4f46e5);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 21px;

      box-shadow:
        0 4px 12px rgba(79,70,229,.25);
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .header-btn {
      border: 0;
      border-radius: 11px;

      padding: 9px 11px;

      background: #eef2ff;
      color: #3730a3;

      font-weight: 750;
    }

    /* =========================
       MAIN
    ========================= */

    .container {
      max-width: 950px;
      margin: auto;

      padding:
        20px
        14px
        110px;
    }

    .welcome {
      text-align: center;

      padding: 30px 15px 25px;
    }

    .welcome-icon {
      width: 68px;
      height: 68px;

      margin: 0 auto 13px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(135deg,#6366f1,#7c3aed);

      color: white;
      font-size: 34px;

      box-shadow:
        0 8px 25px rgba(79,70,229,.22);
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .welcome p {
      margin: 0;
      color: #667085;
      line-height: 1.6;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-row {
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }

    .message-row.user-row {
      justify-content: flex-end;
    }

    .mini-icon {
      flex: 0 0 auto;

      width: 32px;
      height: 32px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #4f46e5;
      color: white;

      font-size: 17px;
    }

    .bubble {
      max-width: min(82%, 720px);

      padding: 12px 14px;

      border-radius: 17px;

      line-height: 1.7;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant-bubble {
      background: white;
      border: 1px solid #e5e7eb;

      border-bottom-left-radius: 5px;

      box-shadow:
        0 2px 10px rgba(0,0,0,.03);
    }

    .user-bubble {
      background: #4f46e5;
      color: white;

      border-bottom-right-radius: 5px;
    }

    .message-actions {
      display: flex;
      gap: 5px;
      margin-top: 7px;
    }

    .message-action {
      border: 0;
      background: transparent;

      color: #667085;

      padding: 3px 6px;
      font-size: 14px;
    }

    .message-action:hover {
      background: #f1f5f9;
      border-radius: 7px;
    }

    /* =========================
       INPUT AREA
    ========================= */

    .composer {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 90;

      background: rgba(247,248,252,.96);
      backdrop-filter: blur(12px);

      border-top: 1px solid #e5e7eb;

      padding: 9px 10px;
    }

    .composer-inner {
      max-width: 950px;
      margin: auto;
    }

    .input-wrap {
      background: white;

      border: 1px solid #d9dce5;

      border-radius: 18px;

      padding: 8px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.05);
    }

    textarea {
      display: block;

      width: 100%;

      min-height: 52px;
      max-height: 150px;

      resize: none;

      border: 0;
      outline: 0;

      padding: 7px 8px;

      background: transparent;

      font-size: 16px;
      line-height: 1.5;
    }

    .tools-row {
      display: flex;
      align-items: center;
      gap: 6px;

      padding-top: 5px;
    }

    .tool-btn {
      width: 42px;
      height: 40px;

      border: 0;
      border-radius: 12px;

      background: #f1f5f9;
      color: #334155;

      font-size: 19px;
    }

    .tool-btn:hover {
      background: #e8ecf3;
    }

    .tool-btn.active {
      background: #fee2e2;
      color: #dc2626;
    }

    .send-btn {
      margin-left: auto;

      width: 45px;
      height: 40px;

      border: 0;
      border-radius: 12px;

      background: #4f46e5;
      color: white;

      font-size: 19px;
    }

    .send-btn:disabled {
      opacity: .5;
    }

    .search-indicator {
      font-size: 12px;
      color: #667085;

      padding-left: 5px;
    }

    .status {
      min-height: 20px;

      padding:
        4px
        7px
        0;

      color: #667085;

      font-size: 13px;
    }

    /* =========================
       SEARCH MENU
    ========================= */

    .search-on {
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    /* =========================
       FILE PREVIEW
    ========================= */

    .attachment-preview {
      display: none;

      margin-bottom: 7px;

      padding: 8px 10px;

      border-radius: 12px;

      background: #f1f5f9;

      font-size: 13px;

      align-items: center;
      gap: 8px;
    }

    .attachment-preview.show {
      display: flex;
    }

    .remove-file {
      margin-left: auto;

      border: 0;
      background: transparent;

      color: #dc2626;

      font-size: 18px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      text-align: center;

      color: #667085;

      padding: 25px 10px;

      line-height: 1.7;
    }

    /* =========================
       HIDDEN FILE INPUTS
    ========================= */

    .hidden {
      display: none !important;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .container {
        padding-top: 8px;
      }

      .welcome {
        padding-top: 20px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .bubble {
        max-width: 90%;
      }

      .brand {
        font-size: 18px;
      }

      .header-btn {
        padding: 8px 9px;
      }

      .search-indicator {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">

    <div class="header-inner">

      <div class="brand">

        <div class="sarathi-icon">
          🧭
        </div>

        <span>सारथी AI</span>

      </div>

      <div class="header-actions">

        <button
          class="header-btn"
          onclick="openStudy()"
        >
          📚 Study
        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="container">

    <section
      id="welcome"
      class="welcome"
    >

      <div class="welcome-icon">
        🧭
      </div>

      <h1>
        नमस्ते! मैं सारथी हूँ 👋
      </h1>

      <p>
        मुझसे लिखकर या बोलकर बात करो।
        फोटो भेजो, सवाल पूछो या Internet Search करो।
      </p>

    </section>


    <section
      id="chatBox"
      class="chat-box"
    >

      <div
        id="emptyMessage"
        class="empty"
      >
        नीचे अपना सवाल लिखो या 🎤 माइक दबाकर बोलो।
      </div>

    </section>

  </main>


  <!-- =========================
       FILE INPUTS
  ========================= -->

  <input
    id="photoInput"
    class="hidden"
    type="file"
    accept="image/*"
  >

  <input
    id="videoInput"
    class="hidden"
    type="file"
    accept="video/*"
  >

  <input
    id="fileInput"
    class="hidden"
    type="file"
    accept=".txt,.csv,.json,.md"
  >


  <!-- =========================
       COMPOSER
  ========================= -->

  <div class="composer">

    <div class="composer-inner">

      <div
        id="attachmentPreview"
        class="attachment-preview"
      >

        <span id="attachmentText">
          फ़ाइल चुनी गई
        </span>

        <button
          class="remove-file"
          onclick="removeAttachment()"
          type="button"
        >
          ×
        </button>

      </div>


      <div class="input-wrap">

        <textarea
          id="input"
          placeholder="सारथी से कुछ पूछें..."
          rows="1"
        ></textarea>


        <div class="tools-row">

          <!-- MICROPHONE -->

          <button
            id="micButton"
            class="tool-btn"
            type="button"
            title="माइक"
            onclick="toggleMicrophone()"
          >
            🎤
          </button>


          <!-- PHOTO -->

          <button
            class="tool-btn"
            type="button"
            title="फोटो"
            onclick="document.getElementById('photoInput').click()"
          >
            📷
          </button>


          <!-- VIDEO -->

          <button
            class="tool-btn"
            type="button"
            title="वीडियो"
            onclick="document.getElementById('videoInput').click()"
          >
            🎥
          </button>


          <!-- FILE -->

          <button
            class="tool-btn"
            type="button"
            title="फाइल"
            onclick="document.getElementById('fileInput').click()"
          >
            📎
          </button>


          <!-- SEARCH -->

          <button
            id="searchButton"
            class="tool-btn"
            type="button"
            title="Internet Search"
            onclick="toggleSearch()"
          >
            🌐
          </button>


          <span
            id="searchIndicator"
            class="search-indicator"
          >
            Search OFF
          </span>


          <!-- SPEAKER -->

          <button
            id="voiceButton"
            class="tool-btn"
            type="button"
            title="आवाज़"
            onclick="toggleVoice()"
          >
            🔊
          </button>


          <!-- SEND -->

          <button
            id="sendButton"
            class="send-btn"
            type="button"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>


      <div
        id="status"
        class="status"
      ></div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /* =====================================================
       API
    ===================================================== */

    const API_BASE =
      "https://sarathi-ai.mjmanjumanjeet0.workers.dev";


    /* =====================================================
       STATE
    ===================================================== */

    let messages = [];

    let useSearch = false;

    let voiceEnabled = true;

    let recognition = null;

    let isListening = false;

    let selectedFile = null;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const input =
      document.getElementById("input");

    const sendButton =
      document.getElementById("sendButton");

    const micButton =
      document.getElementById("micButton");

    const searchButton =
      document.getElementById("searchButton");

    const voiceButton =
      document.getElementById("voiceButton");

    const searchIndicator =
      document.getElementById("searchIndicator");

    const status =
      document.getElementById("status");

    const chatBox =
      document.getElementById("chatBox");

    const welcome =
      document.getElementById("welcome");

    const attachmentPreview =
      document.getElementById("attachmentPreview");

    const attachmentText =
      document.getElementById("attachmentText");


    /* =====================================================
       STATUS
    ===================================================== */

    function setStatus(text) {

      status.textContent =
        text || "";

    }


    /* =====================================================
       ADD MESSAGE
    ===================================================== */

    function addMessage(role, text) {

      const empty =
        document.getElementById(
          "emptyMessage"
        );

      if (empty) {
        empty.remove();
      }

      welcome.style.display = "none";


      const row =
        document.createElement("div");

      row.className =
        "message-row " +
        (role === "user"
          ? "user-row"
          : "");


      if (role === "assistant") {

        const icon =
          document.createElement("div");

        icon.className =
          "mini-icon";

        icon.textContent =
          "🧭";

        row.appendChild(icon);
      }


      const content =
        document.createElement("div");


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble " +
        (role === "user"
          ? "user-bubble"
          : "assistant-bubble");


      bubble.textContent =
        String(text || "");


      content.appendChild(bubble);


      /* Assistant actions */

      if (role === "assistant") {

        const actions =
          document.createElement("div");

        actions.className =
          "message-actions";


        const speak =
          document.createElement("button");

        speak.className =
          "message-action";

        speak.textContent =
          "🔊 सुनें";

        speak.onclick =
          () => speakText(String(text || ""));


        const copy =
          document.createElement("button");

        copy.className =
          "message-action";

        copy.textContent =
          "📋 कॉपी";

        copy.onclick =
          async () => {

            try {

              await navigator.clipboard.writeText(
                String(text || "")
              );

              setStatus(
                "✓ जवाब कॉपी हो गया।"
              );

            } catch {

              setStatus(
                "कॉपी नहीं हो पाया।"
              );

            }

          };


        actions.appendChild(speak);
        actions.appendChild(copy);

        content.appendChild(actions);
      }


      row.appendChild(content);

      chatBox.appendChild(row);


      window.scrollTo({
        top:
          document.body.scrollHeight,
        behavior: "smooth"
      });

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    function updateSearchUI() {

      if (useSearch) {

        searchButton.classList.add(
          "search-on"
        );

        searchIndicator.textContent =
          "Search ON";

      } else {

        searchButton.classList.remove(
          "search-on"
        );

        searchIndicator.textContent =
          "Search OFF";
      }

    }


    function toggleSearch() {

      useSearch =
        !useSearch;

      updateSearchUI();

      setStatus(
        useSearch
          ? "🌐 Internet Search ON है।"
          : "🌐 Internet Search OFF है।"
      );

    }


    /* =====================================================
       VOICE OUTPUT
    ===================================================== */

    function toggleVoice() {

      voiceEnabled =
        !voiceEnabled;

      voiceButton.textContent =
        voiceEnabled
          ? "🔊"
          : "🔇";

      if (!voiceEnabled) {

        speechSynthesis.cancel();

        setStatus(
          "🔇 Voice OFF है।"
        );

      } else {

        setStatus(
          "🔊 Voice ON है।"
        );
      }

    }


    function speakText(text) {

      if (!("speechSynthesis" in window)) {

        setStatus(
          "इस browser में आवाज़ की सुविधा उपलब्ध नहीं है।"
        );

        return;
      }

      speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          String(text || "")
        );


      utterance.lang =
        "hi-IN";

      utterance.rate =
        0.95;

      utterance.pitch =
        1;


      const voices =
        speechSynthesis.getVoices();


      const hindiVoice =
        voices.find(
          voice =>
            voice.lang &&
            voice.lang
              .toLowerCase()
              .startsWith("hi")
        );


      if (hindiVoice) {

        utterance.voice =
          hindiVoice;

      }


      utterance.onstart =
        () => {

          setStatus(
            "🔊 सारथी बोल रहा है..."
          );

        };


      utterance.onend =
        () => {

          setStatus("");

        };


      speechSynthesis.speak(
        utterance
      );

    }


    /* =====================================================
       MICROPHONE
       Browser Speech Recognition
    ===================================================== */

    function createRecognition() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        return null;
      }


      const r =
        new SpeechRecognition();


      r.lang =
        "hi-IN";

      r.continuous =
        false;

      r.interimResults =
        false;

      r.maxAlternatives =
        1;


      r.onstart =
        () => {

          isListening =
            true;

          micButton.classList.add(
            "active"
          );

          micButton.textContent =
            "⏹️";

          setStatus(
            "🎤 सुन रहा हूँ... बोलिए"
          );

        };


      r.onresult =
        event => {

          const transcript =
            event
              ?.results?.[0]?.[0]?.transcript ||
            "";


          input.value =
            transcript.trim();


          if (input.value) {

            setStatus(
              "✓ आपकी आवाज़ समझ ली।"
            );

            sendMessage();

          }

        };


      r.onerror =
        event => {

          console.error(
            "Speech recognition:",
            event
          );


          setStatus(
            "माइक से आवाज़ समझने में समस्या हुई।"
          );

        };


      r.onend =
        () => {

          isListening =
            false;

          micButton.classList.remove(
            "active"
          );

          micButton.textContent =
            "🎤";

        };


      return r;

    }


    async function toggleMicrophone() {

      if (isListening) {

        try {

          recognition?.stop();

        } catch {}

        return;
      }


      if (
        !(
          window.SpeechRecognition ||
          window.webkitSpeechRecognition
        )
      ) {

        setStatus(
          "इस browser में Voice Recognition उपलब्ध नहीं है।"
        );

        return;
      }


      recognition =
        createRecognition();


      if (!recognition) {

        setStatus(
          "माइक उपलब्ध नहीं है।"
        );

        return;
      }


      try {

        recognition.start();

      } catch (error) {

        console.error(
          error
        );

        setStatus(
          "माइक शुरू नहीं हो पाया।"
        );

      }

    }


    /* =====================================================
       DATE
    ===================================================== */

    function isDateQuestion(text) {

      return /^(आज|आज की तारीख|आज का दिन|today|today's date|current date)\s*[?؟.!]*$/i
        .test(text);

    }


    /* =====================================================
       CHAT
    ===================================================== */

    async function sendMessage(
      customText = null
    ) {

      const text =
        customText !== null
          ? String(customText).trim()
          : input.value.trim();


      if (!text) {

        setStatus(
          "कृपया पहले अपना सवाल लिखें।"
        );

        input.focus();

        return;
      }


      /* Date locally */

      if (isDateQuestion(text)) {

        const localDate =
          new Intl.DateTimeFormat(
            "hi-IN",
            {
              timeZone:
                "Asia/Kolkata",

              weekday:
                "long",

              day:
                "numeric",

              month:
                "long",

              year:
                "numeric"
            }
          ).format(
            new Date()
          );


        addMessage(
          "user",
          text
        );


        messages.push({
          role: "user",
          content: text
        });


        const answer =
          `आज की तारीख है ${localDate}।`;


        addMessage(
          "assistant",
          answer
        );


        messages.push({
          role: "assistant",
          content: answer
        });


        input.value = "";


        if (voiceEnabled) {
          speakText(answer);
        }

        return;
      }


      /* User message */

      addMessage(
        "user",
        text
      );


      messages.push({
        role: "user",
        content: text
      });


      input.value = "";

      resizeInput();


      setStatus(
        useSearch
          ? "🌐 Internet Search से जानकारी खोजी जा रही है..."
          : "सारथी जवाब तैयार कर रहा है..."
      );


      sendButton.disabled =
        true;

      micButton.disabled =
        true;


      try {

        const response =
          await fetch(
            API_BASE +
              "/api/chat",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  message:
                    text,

                  history:
                    messages,

                  webSearch:
                    Boolean(
                      useSearch
                    )
                })
            }
          );


        let data;


        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "Server response पढ़ा नहीं जा सका।"
          );

        }


        if (!response.ok) {

          throw new Error(
            data?.error ||
            data?.answer ||
            data?.detail ||
            "जवाब नहीं मिल पाया।"
          );

        }


        const reply =
          data?.answer ||
          "कोई जवाब नहीं मिला।";


        addMessage(
          "assistant",
          reply
        );


        messages.push({
          role:
            "assistant",

          content:
            reply
        });


        if (
          data?.searchUsed === true
        ) {

          setStatus(
            "✓ Internet Search से ताज़ा जानकारी मिली।"
          );

        } else if (
          data?.selfCorrected === true
        ) {

          setStatus(
            "✓ Self-check करके जवाब सुधारा गया।"
          );

        } else if (
          data?.selfChecked === true
        ) {

          setStatus(
            "✓ जवाब self-check किया गया।"
          );

        } else {

          setStatus("");

        }


        /* Voice reply */

        if (
          voiceEnabled
        ) {

          speakText(
            reply
          );

        }


      } catch (error) {

        console.error(
          "Chat error:",
          error
        );


        addMessage(
          "assistant",
          "अभी जवाब नहीं मिल पाया। कृपया फिर से कोशिश करें।"
        );


        setStatus(
          "त्रुटि: " +
          (
            error?.message ||
            "Unknown error"
          )
        );


      } finally {

        sendButton.disabled =
          false;

        micButton.disabled =
          false;

        input.focus();

      }

    }


    /* =====================================================
       PHOTO
    ===================================================== */

    document
      .getElementById("photoInput")
      .addEventListener(
        "change",
        handlePhoto
      );


    async function handlePhoto(event) {

      const file =
        event.target.files?.[0];


      if (!file) {
        return;
      }


      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        setStatus(
          "कृपया सही फोटो चुनें।"
        );

        return;
      }


      showAttachment(
        "📷 " + file.name
      );


      addMessage(
        "user",
        "📷 मैंने एक फोटो भेजी है।"
      );


      setStatus(
        "📷 फोटो को सारथी देख रहा है..."
      );


      try {

        const image =
          await fileToDataURL(
            file
          );


        const question =
          input.value.trim() ||
          "इस फोटो को ध्यान से देखकर सरल हिंदी में समझाओ।";


        input.value = "";


        const response =
          await fetch(
            API_BASE +
              "/api/vision",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  image:
                    image,

                  question:
                    question
                })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data?.error ||
            "फोटो समझी नहीं जा सकी।"
          );

        }


        const answer =
          data?.answer ||
          "फोटो से कोई उत्तर नहीं मिला।";


        addMessage(
          "assistant",
          answer
        );


        if (voiceEnabled) {

          speakText(
            answer
          );

        }


        setStatus(
          "✓ फोटो समझ ली गई।"
        );


      } catch (error) {

        console.error(
          error
        );


        addMessage(
          "assistant",
          "फोटो को समझने में समस्या हुई।"
        );


        setStatus(
          "त्रुटि: " +
          error.message
        );

      } finally {

        removeAttachment();

        event.target.value = "";

      }

    }


    /* =====================================================
       VIDEO
       First frame → Vision
    ===================================================== */

    document
      .getElementById("videoInput")
      .addEventListener(
        "change",
        handleVideo
      );


    async function handleVideo(event) {

      const file =
        event.target.files?.[0];


      if (!file) {
        return;
      }


      showAttachment(
        "🎥 " + file.name
      );


      addMessage(
        "user",
        "🎥 मैंने एक वीडियो भेजा है।"
      );


      setStatus(
        "🎥 वीडियो का पहला frame देखा जा रहा है..."
      );


      try {

        const image =
          await videoFirstFrame(
            file
          );


        const question =
          input.value.trim() ||
          "इस वीडियो के दिखाई दे रहे frame को देखकर सरल हिंदी में बताओ इसमें क्या है।";


        input.value = "";


        const response =
          await fetch(
            API_BASE +
              "/api/vision",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  image:
                    image,

                  question:
                    question
                })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data?.error ||
            "वीडियो का frame समझा नहीं जा सका।"
          );

        }


        const answer =
          data?.answer ||
          "वीडियो का frame समझ में नहीं आया।";


        addMessage(
          "assistant",
          answer
        );


        if (voiceEnabled) {

          speakText(
            answer
          );

        }


        setStatus(
          "✓ वीडियो के पहले frame की जानकारी मिली।"
        );


      } catch (error) {

        console.error(
          error
        );


        addMessage(
          "assistant",
          "वीडियो को समझने में समस्या हुई।"
        );


        setStatus(
          "त्रुटि: " +
          error.message
        );

      } finally {

        removeAttachment();

        event.target.value = "";

      }

    }


    /* =====================================================
       FILE
       TXT / CSV / JSON / MD
    ===================================================== */

    document
      .getElementById("fileInput")
      .addEventListener(
        "change",
        handleFile
      );


    async function handleFile(event) {

      const file =
        event.target.files?.[0];


      if (!file) {
        return;
      }


      showAttachment(
        "📎 " + file.name
      );


      const allowed =
        [
          "text/plain",
          "text/csv",
          "application/json",
          "text/markdown"
        ];


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      if (
        !allowed.includes(file.type) &&
        ![
          "txt",
          "csv",
          "json",
          "md"
        ].includes(extension)
      ) {

        setStatus(
          "अभी TXT, CSV, JSON और MD फाइल पढ़ी जा सकती है।"
        );

        event.target.value = "";

        return;
      }


      try {

        const content =
          await file.text();


        if (!content.trim()) {

          throw new Error(
            "फाइल खाली है।"
          );

        }


        const question =
          input.value.trim() ||
          "इस फाइल को पढ़कर सरल हिंदी में समझाओ।";


        input.value = "";


        addMessage(
          "user",
          "📎 फाइल भेजी: " +
          file.name
        );


        setStatus(
          "📎 फाइल पढ़कर सारथी जवाब तैयार कर रहा है..."
        );


        const limitedContent =
          content.slice(
            0,
            30000
          );


        const prompt =
          `${question}

फाइल का नाम: ${file.name}

फाइल की सामग्री:
${limitedContent}`;


        await sendMessage(
          prompt
        );


      } catch (error) {

        console.error(
          error
        );


        addMessage(
          "assistant",
          "फाइल पढ़ने में समस्या हुई।"
        );


        setStatus(
          "त्रुटि: " +
          error.message
        );

      } finally {

        removeAttachment();

        event.target.value = "";

      }

    }


    /* =====================================================
       FILE HELPERS
    ===================================================== */

    function showAttachment(name) {

      attachmentText.textContent =
        name;

      attachmentPreview.classList.add(
        "show"
      );

    }


    function removeAttachment() {

      attachmentPreview.classList.remove(
        "show"
      );

      selectedFile =
        null;

    }


    function fileToDataURL(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload =
            () =>
              resolve(
                reader.result
              );


          reader.onerror =
            reject;


          reader.readAsDataURL(
            file
          );

        }
      );

    }


    /* =====================================================
       VIDEO FIRST FRAME
    ===================================================== */

    function videoFirstFrame(file) {

      return new Promise(
        (resolve, reject) => {

          const video =
            document.createElement(
              "video"
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          const url =
            URL.createObjectURL(
              file
            );


          video.src =
            url;

          video.muted =
            true;

          video.playsInline =
            true;


          video.onloadedmetadata =
            () => {

              video.currentTime =
                0;

            };


          video.onseeked =
            () => {

              try {

                const width =
                  video.videoWidth ||
                  640;

                const height =
                  video.videoHeight ||
                  360;


                canvas.width =
                  width;

                canvas.height =
                  height;


                const ctx =
                  canvas.getContext(
                    "2d"
                  );


                ctx.drawImage(
                  video,
                  0,
                  0,
                  width,
                  height
                );


                const image =
                  canvas.toDataURL(
                    "image/jpeg",
                    0.82
                  );


                URL.revokeObjectURL(
                  url
                );


                resolve(
                  image
                );

              } catch (error) {

                URL.revokeObjectURL(
                  url
                );

                reject(
                  error
                );

              }

            };


          video.onerror =
            () => {

              URL.revokeObjectURL(
                url
              );

              reject(
                new Error(
                  "वीडियो पढ़ा नहीं जा सका।"
                )
              );

            };

        }
      );

    }


    /* =====================================================
       TEXTAREA AUTO RESIZE
    ===================================================== */

    function resizeInput() {

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          150
        ) + "px";

    }


    input.addEventListener(
      "input",
      resizeInput
    );


    /* =====================================================
       ENTER
    ===================================================== */

    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =====================================================
       STUDY
    ===================================================== */

    function openStudy() {

      window.location.href =
        "study.html";

    }


    /* =====================================================
       START
    ===================================================== */

    updateSearchUI();

    resizeInput();


    if (
      "speechSynthesis" in window
    ) {

      speechSynthesis.onvoiceschanged =
        () => {};

    }

  </script>
