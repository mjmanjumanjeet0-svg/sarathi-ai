<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#1769e0"
  >

  <title>सारथी AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
    }

    .app {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      padding: 18px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
    }

    header p {
      margin-top: 6px;
      color: #666;
    }

    #chat {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      padding-bottom: 20px;
    }

    .message {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 90%;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #dcecff;
      margin-left: auto;
    }

    .assistant {
      background: white;
      border: 1px solid #ddd;
    }

    .welcome {
      text-align: center;
      margin: 40px 10px;
    }

    .welcome h2 {
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
    }

    /* =========================
       ACTION BUTTONS
       ========================= */

    .actions {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      flex-wrap: wrap;
      background: white;
      border-top: 1px solid #eee;
    }

    button,
    label {
      border: none;
      border-radius: 10px;
      padding: 10px 13px;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #searchButton {
      background: #222;
      color: white;
    }

    #searchButton.active {
      background: #0b7a36;
    }

    #sendButton {
      background: #1769e0;
      color: white;
      min-width: 70px;
    }

    #sendButton:disabled,
    #searchButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #micButton {
      background: #eee;
      color: #222;
    }

    #micButton.active {
      background: #ffd6d6;
      color: #b00000;
    }

    #speakButton {
      background: #eee;
      color: #222;
    }

    #speakButton.active {
      background: #dcecff;
      color: #1769e0;
    }

    #quizButton {
      background: #eee;
      color: #222;
    }

    #photoLabel {
      background: #eee;
      color: #222;
    }

    #photoInput {
      display: none;
    }

    /* =========================
       INPUT
       ========================= */

    .input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
      display: flex;
      gap: 8px;
      position: sticky;
      bottom: 0;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #1769e0;
    }

    #status {
      text-align: center;
      font-size: 13px;
      color: #777;
      padding: 5px;
      background: white;
      min-height: 26px;
    }

    /* =========================
       PHOTO
       ========================= */

    .photo-message {
      max-width: 250px;
      max-height: 300px;
      display: block;
      margin-top: 8px;
      border-radius: 10px;
      object-fit: contain;
    }

    #photoPanel {
      display: none;
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px 14px;
    }

    #photoPanel.active {
      display: block;
    }

    #photoPreview {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      background: #eee;
      border-radius: 10px;
      display: block;
      margin-bottom: 10px;
    }

    .edit-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .edit-actions button {
      background: #eee;
      color: #222;
    }

    #analyzePhotoButton {
      background: #1769e0;
      color: white;
    }

    #savePhotoButton {
      background: #198754;
      color: white;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      header h1 {
        font-size: 23px;
      }

      header p {
        font-size: 13px;
      }

      #chat {
        padding: 12px;
      }

      .message {
        max-width: 94%;
        font-size: 15px;
      }

      .actions {
        overflow-x: auto;
        flex-wrap: nowrap;
      }

      .actions button,
      .actions label {
        white-space: nowrap;
        flex-shrink: 0;
      }

      .input-area {
        padding: 9px;
      }

      #messageInput {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header>

    <h1>
      सारथी AI
    </h1>

    <p>
      आपका निजी हिंदी AI सहायक
    </p>

  </header>


  <!-- CHAT -->

  <main id="chat">

    <div
      class="welcome"
      id="welcome"
    >

      <h2>
        नमस्ते, मैं सारथी हूँ। 👋
      </h2>

      <p>
        आज किसमें मदद करूँ?
      </p>

    </div>

  </main>


  <!-- STATUS -->

  <div id="status"></div>


  <!-- ACTION BUTTONS -->

  <div class="actions">

    <button
      id="searchButton"
      type="button"
    >
      🌐 इंटरनेट सर्च
    </button>


    <button
      id="micButton"
      type="button"
    >
      🎤 बोलें
    </button>


    <button
      id="speakButton"
      type="button"
    >
      🔊 सुनें
    </button>


    <button
      id="quizButton"
      type="button"
    >
      ❓ सवाल पूछो
    </button>


    <label
      id="photoLabel"
      for="photoInput"
    >
      📷 फोटो
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

  </div>


  <!-- PHOTO EDIT PANEL -->

  <div id="photoPanel">

    <img
      id="photoPreview"
      alt="फोटो"
    >

    <div class="edit-actions">

      <button
        id="rotateButton"
        type="button"
      >
        ↻ घुमाएँ
      </button>

      <button
        id="grayButton"
        type="button"
      >
        ⚫ Grayscale
      </button>

      <button
        id="brightnessButton"
        type="button"
      >
        ☀️ Brightness
      </button>

      <button
        id="savePhotoButton"
        type="button"
      >
        💾 Save
      </button>

      <button
        id="analyzePhotoButton"
        type="button"
      >
        🤖 फोटो समझाओ
      </button>

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="अपना सवाल लिखें..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      type="button"
    >
      भेजें
    </button>

  </div>

</div>


<!-- HIDDEN CANVAS -->

<canvas
  id="canvas"
  style="display:none"
></canvas>


<script>

  // ==========================================================
  // WORKER URL
  // ==========================================================

  const API_BASE =
    "https://sarathi-ai.mjmanjumanjeet0.workers.dev";


  // ==========================================================
  // ELEMENTS
  // ==========================================================

  const chat =
    document.getElementById("chat");

  const input =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const searchButton =
    document.getElementById("searchButton");

  const micButton =
    document.getElementById("micButton");

  const speakButton =
    document.getElementById("speakButton");

  const quizButton =
    document.getElementById("quizButton");

  const photoInput =
    document.getElementById("photoInput");

  const photoPanel =
    document.getElementById("photoPanel");

  const photoPreview =
    document.getElementById("photoPreview");

  const status =
    document.getElementById("status");

  const welcome =
    document.getElementById("welcome");

  const canvas =
    document.getElementById("canvas");


  // ==========================================================
  // STATE
  // ==========================================================

  let messages = [];

  let lastAnswer = "";

  let searchMode = false;

  // नया Voice Input
  let mediaRecorder = null;

  let audioChunks = [];

  let isRecording = false;

  let microphoneStream = null;

  let isSpeaking = false;

  let currentPhoto = "";

  let rotation = 0;

  let grayscale = false;

  let brightness = 100;


  // ==========================================================
  // STATUS
  // ==========================================================

  function setStatus(text) {

    status.textContent =
      text || "";

  }


  // ==========================================================
  // ADD MESSAGE
  // ==========================================================

  function addMessage(
    role,
    content,
    imageUrl = ""
  ) {

    if (welcome) {
      welcome.remove();
    }

    const div =
      document.createElement("div");

    div.className =
      "message " +
      (
        role === "user"
          ? "user"
          : "assistant"
      );

    div.textContent =
      content || "";


    if (imageUrl) {

      const image =
        document.createElement("img");

      image.className =
        "photo-message";

      image.src =
        imageUrl;

      image.alt =
        "अपलोड की गई फोटो";

      div.appendChild(image);

    }


    chat.appendChild(div);

    chat.scrollTop =
      chat.scrollHeight;

  }


  // ==========================================================
  // CHAT
  // ==========================================================

  async function sendMessage(
    useSearch = false,
    customText = null
  ) {

    const text =
      customText !== null
        ? String(customText).trim()
        : input.value.trim();


    if (!text) {

      setStatus(
        "कृपया पहले अपना सवाल लिखें।"
      );

      return;

    }


    addMessage(
      "user",
      text
    );


    messages.push({
      role: "user",
      content: text
    });


    input.value = "";


    setStatus(
      useSearch
        ? "🌐 Internet Search से जानकारी खोजी जा रही है..."
        : "सारथी जवाब तैयार कर रहा है..."
    );


    sendButton.disabled = true;

    searchButton.disabled = true;


    try {

      const response =
        await fetch(
          API_BASE + "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              message:
                text,

              history:
                messages,

              webSearch:
                Boolean(useSearch)

            })
          }
        );


      let data = null;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "Server response पढ़ा नहीं जा सका।"
        );

      }


      if (!response.ok) {

        throw new Error(
          data?.answer ||
          data?.error ||
          data?.detail ||
          "जवाब नहीं मिल पाया।"
        );

      }


      const reply =
        data?.answer ||
        "कोई जवाब नहीं मिला।";


      lastAnswer =
        reply;


      addMessage(
        "assistant",
        reply
      );


      messages.push({
        role: "assistant",
        content: reply
      });


      if (
        data?.selfChecked === true
      ) {

        setStatus(
          useSearch
            ? "✓ Search करके और Self-check करके जवाब दिया गया"
            : "✓ Self-check करके जवाब सुधारा गया"
        );

      } else {

        setStatus("");

      }


    } catch (error) {

      console.error(
        "Chat error:",
        error
      );


      addMessage(
        "assistant",
        "अभी जवाब नहीं मिल पाया। कृपया फिर से कोशिश करें।"
      );


      setStatus(
        "त्रुटि: " +
        (
          error?.message ||
          "Unknown error"
        )
      );


    } finally {

      sendButton.disabled = false;

      searchButton.disabled = false;

      input.focus();

    }

  }


  // ==========================================================
  // SEND BUTTON
  // ==========================================================

  sendButton.addEventListener(
    "click",
    () => {

      sendMessage(
        searchMode
      );

    }
  );


  // ==========================================================
  // SEARCH BUTTON
  // ==========================================================

  searchButton.addEventListener(
    "click",
    () => {

      searchMode =
        !searchMode;


      searchButton.classList.toggle(
        "active",
        searchMode
      );


      if (searchMode) {

        searchButton.textContent =
          "🌐 सर्च ON";

        setStatus(
          "✓ Internet Search चालू है"
        );

      } else {

        searchButton.textContent =
          "🌐 इंटरनेट सर्च";

        setStatus(
          "Internet Search बंद है"
        );

      }

    }
  );


  // ==========================================================
  // ENTER KEY
  // ==========================================================

  input.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage(
          searchMode
        );

      }

    }
  );


  // ==========================================================
  // QUIZ
  // ==========================================================

  quizButton.addEventListener(
    "click",
    () => {

      sendMessage(
        false,

        "मुझसे पढ़ाई का एक सवाल पूछो। एक समय में केवल एक सवाल पूछना और मेरे उत्तर का इंतजार करना।"
      );

    }
  );


  // ==========================================================
  // CLEAN TEXT FOR SPEECH
  // ==========================================================

  function cleanTextForSpeech(text) {

    if (!text) {
      return "";
    }


    let clean =
      String(text);


    clean =
      clean.replace(
        /```[\s\S]*?```/g,
        " "
      );


    clean =
      clean.replace(
        /`([^`]*)`/g,
        "$1"
      );


    clean =
      clean.replace(
        /!\[([^\]]*)\]\([^)]+\)/g,
        "$1"
      );


    clean =
      clean.replace(
        /\[([^\]]+)\]\([^)]+\)/g,
        "$1"
      );


    clean =
      clean.replace(
        /^\s*#{1,6}\s*/gm,
        ""
      );


    clean =
      clean.replace(
        /^\s*[-*+•▪◦]\s+/gm,
        ""
      );


    clean =
      clean.replace(
        /^\s*\d+[\.\)]\s+/gm,
        ""
      );


    clean =
      clean.replace(
        /[*_~]+/g,
        ""
      );


    clean =
      clean.replace(
        /^\s*>\s?/gm,
        ""
      );


    clean =
      clean.replace(
        /<[^>]*>/g,
        " "
      );


    clean =
      clean.replace(
        /https?:\/\/\S+/gi,
        " "
      );


    clean =
      clean.replace(
        /[\w.+-]+@[\w-]+\.[\w.-]+/gi,
        " "
      );


    clean =
      clean.replace(
        /^\s*[-*_]{3,}\s*$/gm,
        " "
      );


    clean =
      clean.replace(
        /([.!?।])\1{2,}/g,
        "$1"
      );


    clean =
      clean.replace(
        /\s+/g,
        " "
      );


    return clean.trim();

  }


  // ==========================================================
  // TEXT TO SPEECH
  // ==========================================================

  function speakText(text) {

    if (
      !("speechSynthesis" in window)
    ) {

      setStatus(
        "इस browser में पढ़कर सुनाने की सुविधा उपलब्ध नहीं है।"
      );

      return;

    }


    if (
      !text ||
      !String(text).trim()
    ) {

      setStatus(
        "पहले AI का जवाब आने दें।"
      );

      return;

    }


    speechSynthesis.cancel();


    const cleanText =
      cleanTextForSpeech(text);


    if (!cleanText) {

      setStatus(
        "इस जवाब में पढ़ने योग्य टेक्स्ट नहीं है।"
      );

      return;

    }


    const utterance =
      new SpeechSynthesisUtterance(
        cleanText
      );


    utterance.lang =
      "hi-IN";

    utterance.rate =
      0.90;

    utterance.pitch =
      1;

    utterance.volume =
      1;


    try {

      const voices =
        speechSynthesis.getVoices();


      const hindiVoice =
        voices.find(
          voice =>
            voice.lang &&
            voice.lang
              .toLowerCase()
              .startsWith("hi")
        );


      if (hindiVoice) {

        utterance.voice =
          hindiVoice;

      }

    } catch (error) {

      console.log(
        "Hindi voice selection error:",
        error
      );

    }


    utterance.onstart =
      () => {

        isSpeaking = true;

        speakButton.textContent =
          "⏹️ रोकें";

        speakButton.classList.add(
          "active"
        );

        setStatus(
          "🔊 पढ़कर सुना रहा हूँ..."
        );

      };


    utterance.onend =
      () => {

        isSpeaking = false;

        speakButton.textContent =
          "🔊 सुनें";

        speakButton.classList.remove(
          "active"
        );

        setStatus("");

      };


    utterance.onerror =
      () => {

        isSpeaking = false;

        speakButton.textContent =
          "🔊 सुनें";

        speakButton.classList.remove(
          "active"
        );

        setStatus(
          "आवाज़ चलाने में समस्या हुई।"
        );

      };


    speechSynthesis.speak(
      utterance
    );

  }


  // ==========================================================
  // SPEAK BUTTON
  // ==========================================================

  speakButton.addEventListener(
    "click",
    () => {

      if (isSpeaking) {

        speechSynthesis.cancel();

        isSpeaking = false;

        speakButton.textContent =
          "🔊 सुनें";

        speakButton.classList.remove(
          "active"
        );

        setStatus("");

        return;

      }


      speakText(
        lastAnswer
      );

    }
  );


  // ==========================================================
  // NEW VOICE INPUT
  // MediaRecorder + Cloudflare Worker + Groq Whisper
  // ==========================================================

  async function startVoiceInput() {

    if (isRecording) {

      stopVoiceInput();

      return;

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      setStatus(
        "🎤 इस browser में microphone उपलब्ध नहीं है।"
      );

      return;

    }


    try {

      // Microphone permission
      microphoneStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });


      audioChunks = [];


      // Browser के हिसाब से audio format
      let mimeType =
        "audio/webm";


      if (
        MediaRecorder.isTypeSupported(
          "audio/webm;codecs=opus"
        )
      ) {

        mimeType =
          "audio/webm;codecs=opus";

      } else if (
        MediaRecorder.isTypeSupported(
          "audio/webm"
        )
      ) {

        mimeType =
          "audio/webm";

      } else if (
        MediaRecorder.isTypeSupported(
          "audio/mp4"
        )
      ) {

        mimeType =
          "audio/mp4";

      }


      mediaRecorder =
        new MediaRecorder(
          microphoneStream,
          {
            mimeType: mimeType
          }
        );


      // Audio chunks
      mediaRecorder.ondataavailable =
        (event) => {

          if (
            event.data &&
            event.data.size > 0
          ) {

            audioChunks.push(
              event.data
            );

          }

        };


      // Recording शुरू
      mediaRecorder.onstart =
        () => {

          isRecording = true;


          micButton.textContent =
            "⏹️ रोकें";


          micButton.classList.add(
            "active"
          );


          setStatus(
            "🎤 बोलिए... बोलना खत्म होने पर 'रोकें' दबाएँ।"
          );

        };


      // Recording बंद
      mediaRecorder.onstop =
        async () => {

          isRecording = false;


          micButton.textContent =
            "🎤 बोलें";


          micButton.classList.remove(
            "active"
          );


          // Microphone बंद
          if (microphoneStream) {

            microphoneStream
              .getTracks()
              .forEach(
                track =>
                  track.stop()
              );


            microphoneStream =
              null;

          }


          if (
            audioChunks.length === 0
          ) {

            setStatus(
              "🎤 कोई आवाज़ रिकॉर्ड नहीं हुई।"
            );

            return;

          }


          // Blob बनाना
          const audioBlob =
            new Blob(
              audioChunks,
              {
                type: mimeType
              }
            );


          await transcribeVoice(
            audioBlob,
            mimeType
          );

        };


      // Error
      mediaRecorder.onerror =
        (event) => {

          console.error(
            "MediaRecorder error:",
            event
          );


          isRecording = false;


          micButton.textContent =
            "🎤 बोलें";


          micButton.classList.remove(
            "active"
          );


          setStatus(
            "🎤 आवाज़ रिकॉर्ड करने में समस्या हुई।"
          );

        };


      // Recording शुरू
      mediaRecorder.start();

    } catch (error) {

      console.error(
        "Microphone error:",
        error
      );


      isRecording = false;


      micButton.textContent =
        "🎤 बोलें";


      micButton.classList.remove(
        "active"
      );


      if (
        error.name ===
        "NotAllowedError"
      ) {

        setStatus(
          "🎤 Microphone की अनुमति दें।"
        );

      } else if (
        error.name ===
        "NotFoundError"
      ) {

        setStatus(
          "🎤 Microphone नहीं मिला।"
        );

      } else {

        setStatus(
          "🎤 Microphone शुरू नहीं हो सका।"
        );

      }

    }

  }


  // ==========================================================
  // STOP VOICE INPUT
  // ==========================================================

  function stopVoiceInput() {

    if (
      mediaRecorder &&
      mediaRecorder.state !==
      "inactive"
    ) {

      mediaRecorder.stop();

    }

  }


  // ==========================================================
  // AUDIO EXTENSION
  // ==========================================================

  function getAudioFilename(
    mimeType
  ) {

    if (
      mimeType.includes(
        "mp4"
      )
    ) {

      return "voice.mp4";

    }


    if (
      mimeType.includes(
        "ogg"
      )
    ) {

      return "voice.ogg";

    }


    return "voice.webm";

  }


  // ==========================================================
  // VOICE → TEXT
  // ==========================================================

  async function transcribeVoice(
    audioBlob,
    mimeType
  ) {

    try {

      setStatus(
        "⏳ आपकी आवाज़ समझ रहा हूँ..."
      );


      const arrayBuffer =
        await audioBlob.arrayBuffer();


      const bytes =
        new Uint8Array(
          arrayBuffer
        );


      let binary = "";


      const chunkSize =
        0x8000;


      for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
      ) {

        const chunk =
          bytes.subarray(
            i,
            Math.min(
              i + chunkSize,
              bytes.length
            )
          );


        binary +=
          String.fromCharCode(
            ...chunk
          );

      }


      const base64 =
        btoa(binary);


      const response =
        await fetch(
          API_BASE +
          "/api/transcribe",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                audio:
                  base64,

                mimeType:
                  mimeType

              })

          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "Voice server response पढ़ा नहीं जा सका।"
        );

      }


      if (!response.ok) {

        throw new Error(
          data?.error ||
          data?.detail ||
          "Voice transcription failed"
        );

      }


      const spokenText =
        String(
          data?.text ||
          ""
        ).trim();


      if (!spokenText) {

        setStatus(
          "🎤 आवाज़ समझ नहीं आई। फिर से बोलें।"
        );

        return;

      }


      console.log(
        "आपने कहा:",
        spokenText
      );


      // बोले हुए सवाल को input में दिखाएँ
      input.value =
        spokenText;


      // ======================================================
      // IMPORTANT:
      // आवाज़ से मिला सवाल अपने-आप AI को भेजें
      // ======================================================

      sendMessage(
        searchMode,
        spokenText
      );


    } catch (error) {

      console.error(
        "Voice transcription error:",
        error
      );


      setStatus(
        "❌ आवाज़ को समझने में समस्या हुई: " +
        (
          error?.message ||
          "Unknown error"
        )
      );

    }

  }

  // ==========================================================
  // COMPRESS PHOTO
  // ==========================================================

  function compressImage(file) {

    return new Promise(
      (
        resolve,
        reject
      ) => {

        const reader =
          new FileReader();


        reader.onload =
          () => {

            const img =
              new Image();


            img.onload =
              () => {

                const maxSize =
                  1400;


                const scale =
                  Math.min(
                    1,
                    maxSize /
                    Math.max(
                      img.width,
                      img.height
                    )
                  );


                canvas.width =
                  Math.max(
                    1,
                    Math.round(
                      img.width *
                      scale
                    )
                  );


                canvas.height =
                  Math.max(
                    1,
                    Math.round(
                      img.height *
                      scale
                    )
                  );


                const ctx =
                  canvas.getContext(
                    "2d"
                  );


                ctx.drawImage(
                  img,
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


                resolve(
                  canvas.toDataURL(
                    "image/jpeg",
                    0.78
                  )
                );

              };


            img.onerror =
              reject;


            img.src =
              reader.result;

          };


        reader.onerror =
          reject;


        reader.readAsDataURL(
          file
        );

      }
    );

  }


  // ==========================================================
  // PHOTO UPLOAD
  // ==========================================================

  photoInput.addEventListener(

        );

  // ==========================================================
  // ANALYZE PHOTO
  // ==========================================================

  async function analyzePhoto(
    imageData,
    question
  ) {

    if (!imageData) {

      setStatus(
        "पहले फोटो चुनें"
      );

      return;

    }


    setStatus(
      "📷 फोटो समझ रहा हूँ..."
    );


    try {

      const response =
        await fetch(
          API_BASE + "/api/vision",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              image:
                imageData,

              question:
                question

            })
          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "फोटो server response पढ़ा नहीं जा सका।"
        );

      }


      if (!response.ok) {

        throw new Error(
          data?.answer ||
          data?.error ||
          data?.detail ||
          "फोटो समझने में समस्या हुई।"
        );

      }


      const reply =
        data?.answer ||
        "फोटो से कोई जवाब नहीं मिला।";


      lastAnswer =
        reply;


      addMessage(
        "assistant",
        reply
      );


      setStatus(
        "✓ फोटो समझ ली"
      );


    } catch (error) {

      console.error(
        "Vision error:",
        error
      );


      addMessage(
        "assistant",
        "फोटो समझने में समस्या हुई। कृपया फिर से कोशिश करें।"
      );


      setStatus(
        "फोटो त्रुटि: " +
        (
          error?.message ||
          "Unknown error"
        )
      );

    }

  }


  // ==========================================================
  // PHOTO REDRAW
  // ==========================================================

  function redrawPhoto() {

    if (!currentPhoto) {
      return;
    }


    const img =
      new Image();


    img.onload =
      () => {

        const swap =
          rotation % 180 !== 0;


        canvas.width =
          swap
            ? img.height
            : img.width;


        canvas.height =
          swap
            ? img.width
            : img.height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        ctx.save();


        ctx.translate(
          canvas.width / 2,
          canvas.height / 2
        );


        ctx.rotate(
          rotation *
          Math.PI /
          180
        );


        ctx.filter =
          "grayscale(" +
          (
            grayscale
              ? 1
              : 0
          ) +
          ") brightness(" +
          brightness +
          "%)";


        ctx.drawImage(
          img,
          -img.width / 2,
          -img.height / 2
        );


        ctx.restore();


        currentPhoto =
          canvas.toDataURL(
            "image/jpeg",
            0.88
          );


        photoPreview.src =
          currentPhoto;

      };


    img.src =
      currentPhoto;

  }
