<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="सारथी AI से पढ़ाई करें और Quiz अभ्यास करें।">
  <title>सारथी AI Study</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner, main {
      width: min(900px, 100%);
      margin: auto;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand { font-size: 20px; font-weight: 800; }

    main { padding: 18px 14px 40px; }

    .card {
      padding: 18px;
      margin-bottom: 16px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 18px #1720330b;
    }

    h1 { font-size: 24px; }
    h2 { margin-top: 0; font-size: 19px; }
    p { line-height: 1.6; }
    .muted { color: #667085; }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: 700;
    }

    select, textarea, button { font: inherit; }

    select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d7dce5;
      border-radius: 10px;
      background: #fff;
      color: #172033;
    }

    textarea { min-height: 130px; resize: vertical; }

    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    .primary { color: #fff; background: #4f46e5; }
    .secondary { color: #3730a3; background: #eef2ff; }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .status {
      min-height: 24px;
      margin-top: 12px;
      color: #475467;
      overflow-wrap: anywhere;
    }

    .answer {
      min-height: 70px;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f8fafc;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }
    .quiz-options { display: grid; gap: 10px; }

    .option {
      width: 100%;
      text-align: left;
      background: #f8fafc;
      border: 1px solid #d7dce5;
    }

    .option.correct { background: #dcfce7; }
    .option.wrong { background: #fee2e2; }

    @media (max-width: 480px) {
      .buttons button { flex: 1; }
      h1 { font-size: 22px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand">📚 सारथी AI Study</div>
      <button class="secondary" id="homeBtn" type="button">
        ← मुख्य पेज
      </button>
    </div>
  </header>

  <main>
    <section class="card">
      <h1>पढ़ाई में सारथी AI</h1>
      <p class="muted">
        विषय चुनो, सवाल लिखो और आसान हिंदी में उत्तर प्राप्त करो।
      </p>
    </section>

    <section class="card">
      <h2>🤖 AI से पढ़ाई</h2>

      <form id="studyForm">
        <label for="subject">विषय</label>
        <select id="subject">
          <option>सामान्य अध्ययन</option>
          <option>दर्शनशास्त्र</option>
          <option>इतिहास</option>
          <option>होम साइंस</option>
          <option>राजनीति विज्ञान</option>
          <option>मनोविज्ञान</option>
          <option>हिंदी</option>
          <option>अंग्रेज़ी</option>
          <option>विज्ञान</option>
          <option>गणित</option>
        </select>

        <label for="question">अपना प्रश्न</label>
        <textarea
          id="question"
          maxlength="8000"
          required
          placeholder="अपना सवाल यहाँ लिखें।"
        ></textarea>

        <div class="buttons">
          <button class="primary" id="askBtn" type="submit">
            उत्तर बताओ
          </button>
          <button class="secondary" id="clearBtn" type="button">
            साफ करें
          </button>
        </div>
      </form>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>📝 उत्तर</h2>
      <div class="answer" id="answer" aria-live="polite">
        तुम्हारा उत्तर यहाँ दिखाई देगा।
      </div>
    </section>

    <section class="card">
      <h2>🧠 Quiz</h2>
      <label for="quizSubject">Quiz विषय</label>
      <select id="quizSubject">
        <option>सामान्य अध्ययन</option>
        <option>इतिहास</option>
        <option>दर्शनशास्त्र</option>
        <option>होम साइंस</option>
        <option>विज्ञान</option>
        <option>गणित</option>
      </select>

      <div class="buttons">
        <button class="primary" id="startQuizBtn" type="button">
          Quiz शुरू करें
        </button>
      </div>
    </section>

    <section class="card hidden" id="quizCard">
      <h2 id="quizTitle">प्रश्न</h2>
      <p id="score">अंक: 0</p>
      <div id="quizOptions" class="quiz-options"></div>
      <div id="quizStatus" class="status" aria-live="polite"></div>
      <div class="buttons">
        <button class="primary" id="nextBtn" type="button" disabled>
          अगला प्रश्न
        </button>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const API_BASE = "https://sarathi-ai.mjmanjumanjeet0.workers.dev";
    const MAX_QUESTION_LENGTH = 8000;
    const REQUEST_TIMEOUT_MS = 50000;

    const $ = id => document.getElementById(id);
    let activeController = null;

    $("homeBtn").addEventListener("click", () => {
      window.location.assign("./index.html");
    });

    $("clearBtn").addEventListener("click", () => {
      if (activeController) activeController.abort();

      $("question").value = "";
      $("answer").textContent = "तुम्हारा उत्तर यहाँ दिखाई देगा।";
      $("status").textContent = "";
      $("askBtn").disabled = false;
    });

    $("studyForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (activeController) return;

      const question = $("question").value.trim();
      const subject = $("subject").value;

      if (!question) {
        $("status").textContent = "कृपया अपना प्रश्न लिखें।";
        return;
      }

      if (question.length > MAX_QUESTION_LENGTH) {
        $("status").textContent = "प्रश्न बहुत लंबा है। कृपया छोटा करें।";
        return;
      }

      const prompt =
        "विषय: " + subject + "\n\n" +
        "प्रश्न: " + question + "\n\n" +
        "सरल हिंदी में सही उत्तर दो। परीक्षा के प्रश्न में जरूरत के अनुसार " +
        "भूमिका, मुख्य बिंदु, उदाहरण और निष्कर्ष शामिल करो। " +
        "अनिश्चित जानकारी को तथ्य की तरह प्रस्तुत मत करो।";

      const controller = new AbortController();
      activeController = controller;

      $("askBtn").disabled = true;
      $("status").textContent = "सारथी उत्तर तैयार कर रहा है...";
      $("answer").textContent = "कृपया प्रतीक्षा करें...";

      const timeoutId = setTimeout(
        () => controller.abort(),
        REQUEST_TIMEOUT_MS
      );

      try {
        const response = await fetch(API_BASE + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: prompt, history: [] }),
          signal: controller.signal,
          credentials: "omit",
          cache: "no-store",
          redirect: "error"
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("सर्वर से सही उत्तर नहीं मिला।");
        }

        if (!response.ok) {
          // Only display a controlled message, not arbitrary server text.
          const messages = {
            400: "प्रश्न की जाँच करें और फिर प्रयास करें।",
            403: "इस वेबसाइट को API उपयोग करने की अनुमति नहीं है।",
            413: "अनुरोध बहुत बड़ा है।",
            429: "बहुत सारे अनुरोध हो गए हैं। थोड़ी देर बाद प्रयास करें।",
            502: "AI सेवा अभी उत्तर नहीं दे रही है।",
            503: "AI सेवा अभी कॉन्फ़िगर नहीं है।",
            504: "अनुरोध में समय अधिक लग गया।"
          };

          throw new Error(messages[response.status] || "अनुरोध पूरा नहीं हुआ।");
        }

        if (!data || typeof data.answer !== "string" || !data.answer.trim()) {
          throw new Error("AI ने खाली उत्तर दिया।");
        }

        $("answer").textContent = data.answer;
        $("status").textContent = "उत्तर तैयार है।";

      } catch (error) {
        $("answer").textContent = "अभी उत्तर नहीं मिल पाया।";

        $("status").textContent =
          error.name === "AbortError"
            ? "अनुरोध रद्द हुआ या समय अधिक लग गया।"
            : (error.message || "नेटवर्क या सर्वर की समस्या है।");

      } finally {
        clearTimeout(timeoutId);
        activeController = null;
        $("askBtn").disabled = false;
      }
    });

    const quizData = {
      "सामान्य अध्ययन": [
        {
          q: "भारत की राजधानी क्या है?",
          options: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"],
          answer: 1
        },
        {
          q: "भारत का राष्ट्रीय पशु कौन है?",
          options: ["शेर", "हाथी", "बाघ", "हिरण"],
          answer: 2
        }
      ],
      "इतिहास": [
        {
          q: "भारत स्वतंत्र कब हुआ?",
          options: ["1945", "1946", "1947", "1950"],
          answer: 2
        },
        {
          q: "मुगल साम्राज्य की स्थापना किसने की?",
          options: ["अकबर", "बाबर", "हुमायूँ", "शाहजहाँ"],
          answer: 1
        }
      ],
      "दर्शनशास्त्र": [
        {
          q: "सुकरात किस क्षेत्र से संबंधित थे?",
          options: ["दर्शन", "भौतिकी", "जीवविज्ञान", "अर्थशास्त्र"],
          answer: 0
        }
      ],
      "होम साइंस": [
        {
          q: "संतुलित आहार में क्या शामिल होता है?",
          options: [
            "केवल कार्बोहाइड्रेट",
            "केवल प्रोटीन",
            "सभी आवश्यक पोषक तत्व",
            "केवल वसा"
          ],
          answer: 2
        }
      ],
      "विज्ञान": [
        {
          q: "जल का रासायनिक सूत्र क्या है?",
          options: ["CO₂", "H₂O", "O₂", "NaCl"],
          answer: 1
        }
      ],
      "गणित": [
        {
          q: "100 का 25% कितना है?",
          options: ["10", "20", "25", "50"],
          answer: 2
        }
      ]
    };

    let questions = [];
    let questionIndex = 0;
    let score = 0;
    let answered = false;

    $("startQuizBtn").addEventListener("click", () => {
      questions = quizData[$("quizSubject").value] || [];
      questionIndex = 0;
      score = 0;

      $("quizCard").classList.remove("hidden");

      if (!questions.length) {
        $("quizTitle").textContent = "प्रश्न उपलब्ध नहीं हैं";
        $("quizOptions").replaceChildren();
        $("quizStatus").textContent = "दूसरा विषय चुनें।";
        $("score").textContent = "अंक: 0";
        $("nextBtn").disabled = true;
        return;
      }

      showQuestion();
      $("quizCard").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    function showQuestion() {
      answered = false;

      if (questionIndex >= questions.length) {
        $("quizTitle").textContent = "Quiz पूरा हो गया!";
        $("quizOptions").replaceChildren();
        $("quizStatus").textContent =
          "तुम्हारा स्कोर: " + score + " / " + questions.length;
        $("nextBtn").disabled = true;
        return;
      }

      const item = questions[questionIndex];

      $("quizTitle").textContent = (questionIndex + 1) + ". " + item.q;
      $("score").textContent = "अंक: " + score;
      $("quizStatus").textContent = "";
      $("nextBtn").disabled = true;
      $("quizOptions").replaceChildren();

      item.options.forEach((text, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option";
        button.textContent = text;
        button.addEventListener("click", () => chooseAnswer(index));
        $("quizOptions").appendChild(button);
      });
    }

    function chooseAnswer(index) {
      if (answered) return;
      answered = true;

      const item = questions[questionIndex];
      const buttons = $("quizOptions").querySelectorAll("button");

      buttons.forEach((button, i) => {
        button.disabled = true;

        if (i === item.answer) {
          button.classList.add("correct");
        }
      });

      if (index === item.answer) {
        score++;
        $("quizStatus").textContent = "सही उत्तर!";
      } else {
        buttons[index].classList.add("wrong");
        $("quizStatus").textContent =
          "गलत उत्तर। हरे रंग में सही उत्तर दिखाया गया है।";
      }

      $("score").textContent = "अंक: " + score;
      $("nextBtn").disabled = false;
    }

    $("nextBtn").addEventListener("click", () => {
      if (!answered) return;
      questionIndex++;
      showQuestion();
    });
  </script>
</body>
</html>
