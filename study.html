<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>सारथी AI - Study Center</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4f7fb;
      color: #172033;
    }

    .container {
      width: min(900px, 94%);
      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .header {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    .header p {
      margin: 0;
      color: #667085;
      line-height: 1.5;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      background: white;
      color: #172033;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.55;
    }

    .hint {
      margin-top: 7px;
      font-size: 13px;
      color: #667085;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .primary {
      background: #4f46e5;
      color: white;
    }

    .secondary {
      background: #eef2ff;
      color: #3730a3;
    }

    .search {
      background: #e8f7ee;
      color: #137333;
    }

    .clear {
      background: #f2f4f7;
      color: #344054;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 12px;
      margin-top: 14px;
      line-height: 1.5;
      font-size: 14px;
    }

    .status.show {
      display: block;
    }

    .status.loading {
      background: #eef2ff;
      color: #3730a3;
    }

    .status.error {
      background: #fff1f2;
      color: #b42318;
    }

    .status.success {
      background: #ecfdf3;
      color: #027a48;
    }

    .answer-card {
      display: none;
    }

    .answer-card.show {
      display: block;
    }

    .answer-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .answer {
      line-height: 1.8;
      font-size: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .answer h1,
    .answer h2,
    .answer h3 {
      line-height: 1.4;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .badge {
      background: #f2f4f7;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      color: #475467;
    }

    .footer {
      text-align: center;
      color: #667085;
      font-size: 13px;
      margin-top: 18px;
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 23px;
      }

      textarea {
        min-height: 130px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">
      <h1>📚 सारथी AI — Study Center</h1>

      <p>
        किसी भी विषय का प्रश्न पूछें और 2, 5, 10 या 12 अंक के
        अनुसार परीक्षा-योग्य उत्तर पाएं।
      </p>
    </div>


    <!-- =========================
         QUESTION CARD
    ========================== -->

    <div class="card">

      <div class="row">

        <div>
          <label for="subject">📖 विषय</label>

          <select id="subject">

            <optgroup label="कला / Arts">
              <option value="इतिहास">इतिहास</option>
              <option value="राजनीति विज्ञान">
                राजनीति विज्ञान
              </option>
              <option value="भूगोल">भूगोल</option>
              <option value="समाजशास्त्र">
                समाजशास्त्र
              </option>
              <option value="मनोविज्ञान">
                मनोविज्ञान
              </option>
              <option value="दर्शनशास्त्र">
                दर्शनशास्त्र
              </option>
              <option value="गृह विज्ञान">
                गृह विज्ञान
              </option>
              <option value="अर्थशास्त्र">
                अर्थशास्त्र
              </option>
              <option value="हिंदी">हिंदी</option>
              <option value="अंग्रेजी">अंग्रेजी</option>
              <option value="संस्कृत">संस्कृत</option>
            </optgroup>


            <optgroup label="विज्ञान / Science">
              <option value="भौतिक विज्ञान">
                भौतिक विज्ञान
              </option>
              <option value="रसायन विज्ञान">
                रसायन विज्ञान
              </option>
              <option value="जीव विज्ञान">
                जीव विज्ञान
              </option>
              <option value="गणित">गणित</option>
              <option value="कंप्यूटर विज्ञान">
                कंप्यूटर विज्ञान
              </option>
              <option value="पर्यावरण विज्ञान">
                पर्यावरण विज्ञान
              </option>
            </optgroup>


            <option value="अन्य विषय">
              अन्य विषय
            </option>

          </select>
        </div>


        <div>
          <label for="marks">📝 अंक</label>

          <select id="marks">
            <option value="auto">
              अपने आप तय करें
            </option>

            <option value="2">
              2 अंक
            </option>

            <option value="5">
              5 अंक
            </option>

            <option value="10">
              10 अंक
            </option>

            <option value="12">
              12 अंक
            </option>
          </select>
        </div>

      </div>


      <label for="question">
        ❓ अपना प्रश्न
      </label>

      <textarea
        id="question"
        placeholder="उदाहरण:
फ्रांसीसी क्रांति के प्रमुख कारणों को समझाइए।

या

प्रकाश संश्लेषण क्या है? 5 अंक"
      ></textarea>

      <div class="hint">
        💡 Enter से नई लाइन लिखें। प्रश्न भेजने के लिए
        नीचे दिए गए बटन का उपयोग करें।
      </div>


      <!-- =========================
           BUTTONS
      ========================== -->

      <div class="buttons">

        <button
          id="askBtn"
          class="primary"
          type="button"
        >
          🤖 सारथी से उत्तर पूछें
        </button>


        <button
          id="normalBtn"
          class="secondary"
          type="button"
        >
          💡 सामान्य उत्तर
        </button>


        <button
          id="searchBtn"
          class="search"
          type="button"
        >
          🌐 इंटरनेट से खोजें
        </button>

      </div>


      <button
        id="clearBtn"
        class="clear"
        type="button"
      >
        🗑️ प्रश्न और उत्तर साफ करें
      </button>


      <!-- =========================
           STATUS
      ========================== -->

      <div
        id="status"
        class="status"
      ></div>

    </div>


    <!-- =========================
         ANSWER
    ========================== -->

    <div
      id="answerCard"
      class="card answer-card"
    >

      <div class="answer-title">
        📖 सारथी का उत्तर
      </div>

      <div class="meta">

        <span
          id="subjectBadge"
          class="badge"
        ></span>

        <span
          id="marksBadge"
          class="badge"
        ></span>

      </div>

      <div
        id="answer"
        class="answer"
      ></div>

    </div>


    <div class="footer">
      सारथी AI • Study Center
    </div>

  </div>


  <script>

    // ==================================================
    // ELEMENTS
    // ==================================================

    const subjectEl =
      document.getElementById("subject");

    const marksEl =
      document.getElementById("marks");

    const questionEl =
      document.getElementById("question");

    const askBtn =
      document.getElementById("askBtn");

    const normalBtn =
      document.getElementById("normalBtn");

    const searchBtn =
      document.getElementById("searchBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const statusEl =
      document.getElementById("status");

    const answerCard =
      document.getElementById("answerCard");

    const answerEl =
      document.getElementById("answer");

    const subjectBadge =
      document.getElementById("subjectBadge");

    const marksBadge =
      document.getElementById("marksBadge");


    // ==================================================
    // API URL
    // ==================================================

    // Study page और Worker एक ही Cloudflare site
    // पर हैं, इसलिए relative URL इस्तेमाल करें।

    const API_URL = "/api/chat";


    // ==================================================
    // MARKS INSTRUCTION
    // ==================================================

    function getMarksInstruction(marks) {

      if (marks === "2") {
        return `
उत्तर 2 अंकों के लिए है।

उत्तर बहुत छोटा और सीधा रखो।
मुख्य परिभाषा या 2 महत्वपूर्ण बातें दो।
अनावश्यक भूमिका, लंबी व्याख्या और निष्कर्ष मत जोड़ो।
`;
      }


      if (marks === "5") {
        return `
उत्तर 5 अंकों के लिए है।

उत्तर मध्यम लंबाई का रखो।

ढाँचा:
- छोटी परिभाषा या भूमिका
- लगभग 4–6 मुख्य बिंदु
- आवश्यक छोटा उदाहरण
- केवल जरूरत हो तो छोटा निष्कर्ष

बहुत गहराई में मत जाओ।
Photosystem, Calvin cycle, ATP/NADPH जैसे advanced details
तभी दो जब प्रश्न विशेष रूप से उन्हें पूछता हो।
सिर्फ उत्तर लंबा करने के लिए अतिरिक्त वैज्ञानिक या ऐतिहासिक
जानकारी मत जोड़ो।
`;
      }


      if (marks === "10") {
        return `
उत्तर 10 अंकों के लिए है।

ढाँचा:
- भूमिका
- स्पष्ट headings
- मुख्य बिंदुओं की पर्याप्त व्याख्या
- आवश्यक उदाहरण
- छोटा निष्कर्ष

उत्तर विस्तृत हो लेकिन दोहराव और अनावश्यक advanced details
से बचो।
`;
      }


      if (marks === "12") {
        return `
उत्तर 12 अंकों के लिए है।

ढाँचा:
- अच्छी लेकिन संक्षिप्त भूमिका
- 5–7 स्पष्ट headings/मुख्य बिंदु, जहाँ प्रश्न के अनुसार उचित हों
- प्रत्येक बिंदु की पर्याप्त परीक्षा-योग्य व्याख्या
- आवश्यक उदाहरण
- स्पष्ट निष्कर्ष

उत्तर इतना विस्तृत हो कि 12 अंकों के प्रश्न के लिए उपयोगी हो,
लेकिन बिना आधार के संख्या, आँकड़े, नाम या अतिरिक्त जानकारी मत जोड़ो।
`;
      }


      return `
अंकों की संख्या निर्धारित नहीं है।

प्रश्न के अनुसार उपयुक्त लंबाई चुनो।
यदि प्रश्न छोटा है तो छोटा उत्तर दो।
यदि प्रश्न विस्तृत है तो आवश्यक headings और व्याख्या दो।
अनावश्यक विस्तार मत करो।
`;
    }


    // ==================================================
    // SUBJECT INSTRUCTION
    // ==================================================

    function getSubjectInstruction(subject) {

      if (subject === "इतिहास") {

        return `
विषय: इतिहास।

इतिहास के उत्तर में:
- तारीख, व्यक्ति और घटना ध्यान से जाँचकर लिखो।
- कारण, घटना और परिणाम अलग रखो।
- बिना आवश्यकता प्रतिशत या संख्या मत दो।
- मनगढ़ंत नाम या उद्धरण मत बनाओ।
- किसी व्यक्ति को बिना आधार अक्षम, भ्रष्ट आदि मत कहो।
- अगर कोई तथ्य निश्चित नहीं है तो उसे मत गढ़ो।
- उत्तर पाठ्यपुस्तक-अनुकूल और परीक्षा-योग्य हिंदी में दो।

फ्रांसीसी क्रांति के प्रश्न में:
प्रथम एस्टेट = पादरी।
द्वितीय एस्टेट = कुलीन।
तृतीय एस्टेट = सामान्य जनता का बड़ा वर्ग, जिसमें बुर्जुआ,
किसान और शहरी श्रमिक शामिल थे।

फ्रांसीसी क्रांति के कारण पूछे जाने पर सामान्यतः:
1. सामाजिक असमानता
2. करों का असमान बोझ
3. वित्तीय संकट और राज्य ऋण
4. खाद्य संकट
5. निरंकुश राजतंत्र और राजनीतिक प्रतिनिधित्व
6. प्रबोधन के विचार

बिना आधार प्रतिशत, "दो-तीन गुना" जैसे आँकड़े,
गलत करों के नाम या मनगढ़ंत व्यक्तियों के नाम मत जोड़ो।
`;
      }


      if (
        subject === "रसायन विज्ञान"
      ) {

        return `
विषय: रसायन विज्ञान।

परिभाषाएँ और रासायनिक तथ्य पाठ्यपुस्तक के अनुसार दो।
परमाणु, अणु, आयन, तत्व और यौगिक को आपस में मत मिलाओ।
रासायनिक समीकरण सही लिखो।
जहाँ आवश्यक हो सूत्र और उदाहरण दो।
`;
      }


      if (
        subject === "भौतिक विज्ञान"
      ) {

        return `
विषय: भौतिक विज्ञान।

सूत्र और SI इकाइयाँ सही रखो।
संख्यात्मक प्रश्न में:
दिया गया → सूत्र → मान रखना → गणना → अंतिम उत्तर।

गणना दोबारा जाँचो।
`;
      }


      if (subject === "गणित") {

        return `
विषय: गणित।

प्रश्न को ध्यान से पढ़ो।
सभी महत्वपूर्ण steps दिखाओ।
समीकरण के दोनों पक्षों पर समान क्रिया करो।
गणना जाँचो।
अंतिम उत्तर स्पष्ट लिखो।
`;
      }


      if (
        subject === "जीव विज्ञान"
      ) {

        return `
विषय: जीव विज्ञान।

परिभाषाएँ वैज्ञानिक और पाठ्यपुस्तक-अनुकूल रखो।
जरूरत के अनुसार प्रक्रिया, कारण, कार्य और उदाहरण समझाओ।
अनावश्यक advanced biological details मत जोड़ो।
`;
      }


      return `
विषय: ${subject}।

इस विषय के प्रश्न का उत्तर पाठ्यपुस्तक-अनुकूल,
सरल और परीक्षा-योग्य भाषा में दो।
`;
    }


    // ==================================================
    // MAIN PROMPT
    // ==================================================

    function buildPrompt() {

      const subject =
        subjectEl.value;

      const marks =
        marksEl.value;

      const question =
        questionEl.value.trim();


      const marksInstruction =
        getMarksInstruction(marks);

      const subjectInstruction =
        getSubjectInstruction(subject);


      return `
तुम "सारथी AI Study Center" हो।

उपयोगकर्ता के प्रश्न का उत्तर केवल प्रश्न के अनुसार दो।

${subjectInstruction}

${marksInstruction}

महत्वपूर्ण सामान्य नियम:

1. मुख्य भाषा सरल हिंदी रखो।
2. परीक्षा में सीधे लिखा जा सके ऐसा उत्तर दो।
3. तथ्य मत गढ़ो।
4. अनिश्चित तथ्य को निश्चित तथ्य मत बनाओ।
5. अनावश्यक अंग्रेजी मत लिखो।
6. प्रश्न में जो नहीं पूछा गया है उसे विस्तार से मत जोड़ो।
7. एक ही बात दोहराओ मत।
8. गलत या संदिग्ध आँकड़े मत बनाओ।
9. नकली उद्धरण मत बनाओ।
10. उत्तर को साफ headings और numbered points में रखो।
11. अगर प्रश्न "अंतर" पूछता है तो तुलना/तालिका उपयोग कर सकते हो।
12. अगर प्रश्न "परिभाषा" पूछता है तो पहले स्पष्ट परिभाषा दो।
13. अगर प्रश्न "कारण" पूछता है तो मुख्य रूप से कारण दो।
14. अगर प्रश्न "परिणाम" पूछता है तो मुख्य रूप से परिणाम दो।
15. अगर प्रश्न गणित/विज्ञान का numerical है तो calculation steps दिखाओ।
16. प्रश्न के स्तर से बहुत ऊपर की जानकारी मत जोड़ो।

उपयोगकर्ता का विषय:
${subject}

अंकों का स्तर:
${marks === "auto" ? "स्वतः उचित स्तर" : marks + " अंक"}

उपयोगकर्ता का प्रश्न:
${question}
`;
    }


    // ==================================================
    // SEND REQUEST
    // ==================================================

    async function askAI(
      useSearch = false
    ) {

      const question =
        questionEl.value.trim();


      if (!question) {

        showStatus(
          "कृपया पहले अपना प्रश्न लिखें।",
          "error"
        );

        questionEl.focus();

        return;
      }


      setLoading(true);

      hideAnswer();


      showStatus(
        useSearch
          ? "🌐 इंटरनेट से जानकारी खोजी जा रही है..."
          : "🤖 सारथी उत्तर तैयार कर रहा है...",
        "loading"
      );


      const prompt =
        buildPrompt();


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                messages: [
                  {
                    role: "user",
                    content: prompt
                  }
                ],

                webSearch: useSearch
              })
            }
          );


        const raw =
          await response.text();


        let data;


        try {

          data =
            raw
              ? JSON.parse(raw)
              : {};

        } catch {

          throw new Error(
            "Server ने वैध JSON उत्तर नहीं दिया।"
          );
        }


        if (!response.ok) {

          const message =
            data?.error ||
            data?.message ||
            `Server error (${response.status})`;


          const code =
            data?.code
              ? ` [${data.code}]`
              : "";


          throw new Error(
            message + code
          );
        }


        const reply =
          typeof data?.reply === "string"
            ? data.reply.trim()
            : "";


        if (!reply) {

          throw new Error(
            "सारथी से खाली उत्तर मिला।"
          );
        }


        showAnswer(
          reply,
          data?.searchUnavailable === true
        );


        showStatus(
          data?.searchUnavailable === true
            ? "⚠️ इंटरनेट खोज अभी उपलब्ध नहीं थी, इसलिए सामान्य उत्तर दिया गया है।"
            : "✅ उत्तर तैयार है।",
          data?.searchUnavailable === true
            ? "loading"
            : "success"
        );


      } catch (error) {

        console.error(
          "Study Center error:",
          error
        );


        showStatus(
          "अभी उत्तर नहीं मिल पाया।\n\n" +
          (
            error instanceof Error
              ? error.message
              : String(error)
          ),
          "error"
        );

      } finally {

        setLoading(false);

      }
    }


    // ==================================================
    // SHOW ANSWER
    // ==================================================

    function showAnswer(
      reply,
      searchUnavailable
    ) {

      answerEl.textContent =
        reply;


      subjectBadge.textContent =
        "विषय: " +
        subjectEl.value;


      const marks =
        marksEl.value;


      marksBadge.textContent =
        marks === "auto"
          ? "अंक: स्वतः"
          : `अंक: ${marks}`;


      answerCard.classList.add(
        "show"
      );


      answerCard.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    // ==================================================
    // HIDE ANSWER
    // ==================================================

    function hideAnswer() {

      answerCard.classList.remove(
        "show"
      );

      answerEl.textContent = "";

    }


    // ==================================================
    // STATUS
    // ==================================================

    function showStatus(
      message,
      type
    ) {

      statusEl.textContent =
        message;

      statusEl.className =
        "status show " +
        type;

    }


    // ==================================================
    // LOADING
    // ==================================================

    function setLoading(
      loading
    ) {

      askBtn.disabled =
        loading;

      normalBtn.disabled =
        loading;

      searchBtn.disabled =
        loading;

      if (loading) {

        askBtn.textContent =
          "⏳ उत्तर तैयार हो रहा है...";

      } else {

        askBtn.textContent =
          "🤖 सारथी से उत्तर पूछें";

      }

    }


    // ==================================================
    // BUTTONS
    // ==================================================

    askBtn.addEventListener(
      "click",
      () => {
        askAI(false);
      }
    );


    normalBtn.addEventListener(
      "click",
      () => {
        askAI(false);
      }
    );


    searchBtn.addEventListener(
      "click",
      () => {
        askAI(true);
      }
    );


    // ==================================================
    // CLEAR
    // ==================================================

    clearBtn.addEventListener(
      "click",
      () => {

        questionEl.value = "";

        hideAnswer();

        statusEl.className =
          "status";

        statusEl.textContent =
          "";

        questionEl.focus();

      }
    );


    // ==================================================
    // CTRL + ENTER
    // ==================================================

    questionEl.addEventListener(
      "keydown",
      (event) => {

        if (
          event.ctrlKey &&
          event.key === "Enter"
        ) {

          event.preventDefault();

          askAI(false);

        }

      }
    );

  </script>
