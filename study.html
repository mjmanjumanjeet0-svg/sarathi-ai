<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>सारथी AI - Study</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 16px;

      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
    }

    .back-btn {
      border: 0;
      background: #eef2ff;
      color: #3730a3;
      padding: 9px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 18px 14px 40px;
    }

    .hero {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow:
        0 5px 20px rgba(0,0,0,.05);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .hero p {
      margin: 0;
      color: #667085;
      line-height: 1.6;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow:
        0 5px 20px rgba(0,0,0,.05);
    }

    .card h2 {
      margin-top: 0;
      font-size: 19px;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: 700;
    }

    select,
    textarea,
    input {
      width: 100%;
      border: 1px solid #d7dce5;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    select:focus,
    textarea:focus,
    input:focus {
      border-color: #6366f1;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
    }

    .primary {
      background: #4f46e5;
      color: white;
    }

    .secondary {
      background: #eef2ff;
      color: #3730a3;
    }

    .success {
      background: #e8f7ee;
      color: #187a45;
    }

    .danger {
      background: #feecec;
      color: #b42318;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      min-height: 24px;
      margin-top: 12px;
      color: #667085;
      font-size: 14px;
    }

    .answer {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 15px;
      line-height: 1.75;
      white-space: pre-wrap;
      min-height: 70px;
    }

    .quiz-question {
      font-size: 19px;
      font-weight: 750;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .quiz-options {
      display: grid;
      gap: 10px;
    }

    .option {
      text-align: left;
      width: 100%;
      background: #f8fafc;
      border: 1px solid #dfe3ea;
      color: #172033;
    }

    .option:hover {
      background: #eef2ff;
    }

    .option.correct {
      background: #dcfce7;
      border-color: #22c55e;
    }

    .option.wrong {
      background: #fee2e2;
      border-color: #ef4444;
    }

    .score {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .small {
      font-size: 13px;
      color: #667085;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 22px;
      }

      .buttons button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="header-inner">

      <div class="brand">
        📚 सारथी AI Study
      </div>

      <button
        class="back-btn"
        onclick="goHome()"
      >
        ← मुख्य पेज
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="container">


    <!-- HERO -->

    <section class="hero">

      <h1>
        पढ़ाई में सारथी AI
      </h1>

      <p>
        विषय चुनो, अपना सवाल लिखो और AI से
        आसान हिंदी में समझो।
      </p>

    </section>


    <!-- ===================================================
         AI STUDY
    ==================================================== -->

    <section class="card">

      <h2>
        🤖 AI से पढ़ाई
      </h2>

      <label for="subject">
        विषय
      </label>

      <select id="subject">

        <option value="सामान्य अध्ययन">
          सामान्य अध्ययन
        </option>

        <option value="दर्शनशास्त्र">
          दर्शनशास्त्र
        </option>

        <option value="इतिहास">
          इतिहास
        </option>

        <option value="होम साइंस">
          होम साइंस
        </option>

        <option value="राजनीति विज्ञान">
          राजनीति विज्ञान
        </option>

        <option value="मनोविज्ञान">
          मनोविज्ञान
        </option>

        <option value="हिंदी">
          हिंदी
        </option>

        <option value="अंग्रेज़ी">
          अंग्रेज़ी
        </option>

        <option value="विज्ञान">
          विज्ञान
        </option>

        <option value="गणित">
          गणित
        </option>

      </select>


      <label for="question">
        अपना प्रश्न
      </label>

      <textarea
        id="question"
        placeholder="उदाहरण: दर्शनशास्त्र क्या है? परीक्षा के लिए समझाइए।"
      ></textarea>


      <div class="buttons">

        <button
          class="primary"
          id="askBtn"
          onclick="askAI()"
        >
          🤖 उत्तर बताओ
        </button>

        <button
          class="secondary"
          onclick="clearQuestion()"
        >
          साफ करें
        </button>

      </div>


      <div
        class="status"
        id="status"
      ></div>

    </section>


    <!-- ===================================================
         ANSWER
    ==================================================== -->

    <section
      class="card"
      id="answerCard"
    >

      <h2>
        📝 उत्तर
      </h2>

      <div
        class="answer"
        id="answer"
      >
        अपना प्रश्न पूछने के बाद उत्तर यहाँ दिखाई देगा।
      </div>

    </section>


    <!-- ===================================================
         QUIZ
    ==================================================== -->

    <section class="card">

      <h2>
        🧠 Quiz
      </h2>

      <p class="small">
        विषय चुनकर अभ्यास प्रश्न शुरू करो।
      </p>


      <label for="quizSubject">
        Quiz विषय
      </label>

      <select id="quizSubject">

        <option value="सामान्य अध्ययन">
          सामान्य अध्ययन
        </option>

        <option value="इतिहास">
          इतिहास
        </option>

        <option value="दर्शनशास्त्र">
          दर्शनशास्त्र
        </option>

        <option value="होम साइंस">
          होम साइंस
        </option>

        <option value="विज्ञान">
          विज्ञान
        </option>

        <option value="गणित">
          गणित
        </option>

      </select>


      <div class="buttons">

        <button
          class="success"
          onclick="startQuiz()"
        >
          ▶ Quiz शुरू करें
        </button>

      </div>

    </section>


    <!-- ===================================================
         QUIZ AREA
    ==================================================== -->

    <section
      class="card hidden"
      id="quizCard"
    >

      <div
        class="score"
        id="score"
      >
        अंक: 0
      </div>

      <div
        class="quiz-question"
        id="quizQuestion"
      ></div>

      <div
        class="quiz-options"
        id="quizOptions"
      ></div>

      <div
        class="status"
        id="quizStatus"
      ></div>

      <div class="buttons">

        <button
          class="primary"
          id="nextBtn"
          onclick="nextQuestion()"
          disabled
        >
          अगला प्रश्न →
        </button>

      </div>

    </section>


  </main>


  <script>

    // =======================================================
    // WORKER URL
    // =======================================================

    const API_BASE =
      "https://sarathi-ai.mjmanjumanjeet0.workers.dev";


    // =======================================================
    // HOME
    // =======================================================

    function goHome() {

      window.location.href =
        "index.html";

    }


    // =======================================================
    // AI STUDY
    // =======================================================

    async function askAI() {

      const subject =
        document
          .getElementById(
            "subject"
          )
          .value;

      const question =
        document
          .getElementById(
            "question"
          )
          .value
          .trim();

      const answer =
        document
          .getElementById(
            "answer"
          );

      const status =
        document
          .getElementById(
            "status"
          );

      const button =
        document
          .getElementById(
            "askBtn"
          );


      if (!question) {

        status.textContent =
          "कृपया पहले प्रश्न लिखें।";

        return;

      }


      button.disabled =
        true;

      status.textContent =
        "🤖 सारथी उत्तर तैयार कर रहा है...";

      answer.textContent =
        "कृपया प्रतीक्षा करें...";


      const prompt = `
विषय: ${subject}

प्रश्न:
${question}

इस प्रश्न का उत्तर सरल हिंदी में दो।

यदि यह परीक्षा का प्रश्न है तो:
- भूमिका
- मुख्य बिंदु
- आवश्यक उदाहरण
- निष्कर्ष

के साथ उत्तर दो।

उत्तर प्रश्न के अनुसार ही रखो।
`;


      try {

        const response =
          await fetch(
            API_BASE +
              "/api/chat",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json",
              },

              body:
                JSON.stringify({

                  message:
                    prompt,

                  history: [
                    {
                      role:
                        "user",

                      content:
                        prompt,
                    },
                  ],

                  webSearch:
                    false,

                }),

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data?.error ||
            "उत्तर नहीं मिला।"
          );

        }


        answer.textContent =
          data?.answer ||
          "कोई उत्तर नहीं मिला।";


        status.textContent =
          data?.selfChecked
            ? "✓ उत्तर जाँचकर दिया गया"
            : "✓ उत्तर तैयार है";


      } catch (error) {

        console.error(
          error
        );


        answer.textContent =
          "अभी उत्तर नहीं मिल पाया।";


        status.textContent =
          "त्रुटि: " +
          (
            error?.message ||
            "Unknown error"
          );

      } finally {

        button.disabled =
          false;

      }

    }


    // =======================================================
    // CLEAR
    // =======================================================

    function clearQuestion() {

      document
        .getElementById(
          "question"
        )
        .value = "";

      document
        .getElementById(
          "answer"
        )
        .textContent =
        "अपना प्रश्न पूछने के बाद उत्तर यहाँ दिखाई देगा।";

      document
        .getElementById(
          "status"
        )
        .textContent = "";

    }


    // =======================================================
    // QUIZ DATA
    // =======================================================

    const quizData = {

      "सामान्य अध्ययन": [

        {
          q: "भारत की राजधानी क्या है?",
          options: [
            "मुंबई",
            "नई दिल्ली",
            "कोलकाता",
            "चेन्नई"
          ],
          answer: 1
        },

        {
          q: "भारत का राष्ट्रीय पशु कौन है?",
          options: [
            "शेर",
            "हाथी",
            "बाघ",
            "हिरण"
          ],
          answer: 2
        },

      ],


      "इतिहास": [

        {
          q: "भारत को स्वतंत्रता कब मिली?",
          options: [
            "1945",
            "1946",
            "1947",
            "1950"
          ],
          answer: 2
        },

        {
          q: "मुगल साम्राज्य की स्थापना किसने की?",
          options: [
            "अकबर",
            "बाबर",
            "हुमायूँ",
            "शाहजहाँ"
          ],
          answer: 1
        },

      ],


      "दर्शनशास्त्र": [

        {
          q: "दर्शन शब्द का सामान्य अर्थ क्या है?",
          options: [
            "ज्ञान के प्रति प्रेम",
            "केवल विज्ञान",
            "केवल धर्म",
            "केवल इतिहास"
          ],
          answer: 0
        },

        {
          q: "सुकरात किस क्षेत्र से संबंधित थे?",
          options: [
            "दर्शन",
            "भौतिकी",
            "जीवविज्ञान",
            "अर्थशास्त्र"
          ],
          answer: 0
        },

      ],

"होम साइंस": [

  {
    q: "संतुलित आहार में क्या शामिल होता है?",
    options: [
      "केवल कार्बोहाइड्रेट",
      "केवल प्रोटीन",
      "सभी आवश्यक पोषक तत्व",
      "केवल वसा"
    ],
    answer: 2
  },

  {
    q: "प्रोटीन का मुख्य कार्य क्या है?",
    options: [
      "शरीर की वृद्धि और ऊतकों की मरम्मत",
      "केवल शरीर को ठंडा करना",
      "केवल स्वाद बढ़ाना",
      "केवल पानी की कमी पूरी करना"
    ],
    answer: 0
  },

],
      "विज्ञान": [

        {
          q: "पौधे प्रकाश संश्लेषण में मुख्य रूप से किस गैस का उपयोग करते हैं?",
          options: [
            "ऑक्सीजन",
            "नाइट्रोजन",
            "कार्बन डाइऑक्साइड",
            "हाइड्रोजन"
          ],
          answer: 2
        },

        {
          q: "जल का रासायनिक सूत्र क्या है?",
          options: [
            "CO₂",
            "H₂O",
            "O₂",
            "NaCl"
          ],
          answer: 1
        },

      ],


      "गणित": [

        {
          q: "25 × 16 कितना है?",
          options: [
            "300",
            "350",
            "400",
            "450"
          ],
          answer: 2
        },

        {
          q: "100 का 25% कितना है?",
          options: [
            "10",
            "20",
            "25",
            "50"
          ],
          answer: 2
        },

      ],

    };


    // =======================================================
    // QUIZ STATE
    // =======================================================

    let currentQuiz =
      [];

    let currentIndex =
      0;

    let scoreValue =
      0;

    let selectedAnswer =
      false;


    // =======================================================
    // START QUIZ
    // =======================================================

    function startQuiz() {

      const subject =
        document
          .getElementById(
            "quizSubject"
          )
          .value;


      currentQuiz =
        quizData[
          subject
        ] || [];


      currentIndex =
        0;

      scoreValue =
        0;

      selectedAnswer =
        false;


      document
        .getElementById(
          "quizCard"
        )
        .classList
        .remove(
          "hidden"
        );


      document
        .getElementById(
          "score"
        )
        .textContent =
        "अंक: 0";


      showQuestion();

    }


    // =======================================================
    // SHOW QUESTION
    // =======================================================

    function showQuestion() {

      if (
        currentIndex >=
        currentQuiz.length
      ) {

        finishQuiz();

        return;

      }


      selectedAnswer =
        false;


      const item =
        currentQuiz[
          currentIndex
        ];


      document
        .getElementById(
          "quizQuestion"
        )
        .textContent =
        `${currentIndex + 1}. ${item.q}`;


      const options =
        document
          .getElementById(
            "quizOptions"
          );


      options.innerHTML =
        "";


      item.options
        .forEach(
          (
            option,
            index
          ) => {

            const button =
              document
                .createElement(
                  "button"
                );


            button.className =
              "option";


            button.textContent =
              option;


            button.onclick =
              () =>
                selectAnswer(
                  index,
                  button
                );


            options.appendChild(
              button
            );

          }
        );


      document
        .getElementById(
          "nextBtn"
        )
        .disabled =
        true;


      document
        .getElementById(
          "quizStatus"
        )
        .textContent =
        "";

    }


    // =======================================================
    // SELECT ANSWER
    // =======================================================

    function selectAnswer(
      index,
      button
    ) {

      if (
        selectedAnswer
      ) {

        return;

      }


      selectedAnswer =
        true;


      const item =
        currentQuiz[
          currentIndex
        ];


      const buttons =
        document
          .querySelectorAll(
            ".option"
          );


      buttons.forEach(
        (
          btn,
          i
        ) => {

          btn.disabled =
            true;


          if (
            i ===
            item.answer
          ) {

            btn.classList
              .add(
                "correct"
              );

          }

        }
      );


      if (
        index ===
        item.answer
      ) {

        scoreValue++;

        button.classList
          .add(
            "correct"
          );


        document
          .getElementById(
            "quizStatus"
          )
          .textContent =
          "✓ सही उत्तर!";

      } else {

        button.classList
          .add(
            "wrong"
          );


        document
          .getElementById(
            "quizStatus"
          )
          .textContent =
          "✗ गलत उत्तर। सही उत्तर हरे रंग में है।";

      }


      document
        .getElementById(
          "score"
        )
        .textContent =
        `अंक: ${scoreValue}`;


      document
        .getElementById(
          "nextBtn"
        )
        .disabled =
        false;

    }


    // =======================================================
    // NEXT
    // =======================================================

    function nextQuestion() {

      currentIndex++;

      showQuestion();

    }


    // =======================================================
    // FINISH
    // =======================================================

    function finishQuiz() {

      const total =
        currentQuiz.length;


      document
        .getElementById(
          "quizQuestion"
        )
        .textContent =
        "🎉 Quiz पूरा हो गया!";


      document
        .getElementById(
          "quizOptions"
        )
        .innerHTML =
        `<div class="answer">
          तुम्हारा स्कोर: ${scoreValue} / ${total}
        </div>`;


      document
        .getElementById(
          "quizStatus"
        )
        .textContent =
        "फिर से अभ्यास करने के लिए Quiz शुरू करें।";


      document
        .getElementById(
          "nextBtn"
        )
        .disabled =
        true;

    }

  </script>

</body>
</html>
